$kind: http-request
id: c41659c9-73f1-4423-ab37-1cc102887799
description: |-
  OpenAPI operation: updateNutritionMeal.

  Run only against Local with synthetic data unless the canonical runbook explicitly says otherwise.
url: "{{baseUrl}}/space/v1/nutrition/meals/{{mealId}}"
method: PATCH
headers:
  Accept: application/json, application/problem+json
  Idempotency-Key: "{{idem_updateNutritionMeal}}"
  Command-Id: "{{command_updateNutritionMeal}}"
  If-Match: "{{etag}}"
  Content-Type: application/json
  Authorization: Bearer {{$vault:spaceAccessToken}}
body:
  type: json
  content: "{}"
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.variables.has("idem_updateNutritionMeal")) pm.variables.set("idem_updateNutritionMeal", pm.variables.replaceIn("{{$guid}}"));
      if (!pm.variables.has("command_updateNutritionMeal")) pm.variables.set("command_updateNutritionMeal", pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const contentType = (pm.response.headers.get("Content-Type") || "").toLowerCase();
      if (pm.response.code >= 400) {
        pm.test("Errors use application/problem+json", () => pm.expect(contentType).to.include("application/problem+json"));
        pm.test("Problem Details has the governed shape", () => {
          const problem = pm.response.json();
          pm.expect(problem).to.have.property("type");
          pm.expect(problem).to.have.property("title");
          pm.expect(problem).to.have.property("status", pm.response.code);
        });
      }
      pm.test("Success response is JSON", () => pm.expect(contentType).to.include("application/json"));
      const responseEtag = pm.response.headers.get("ETag");
      if (responseEtag) pm.variables.set("etag", responseEtag);
      if (contentType.includes("json") && pm.response.text()) {
        const payload = pm.response.json();
        const captures = {"attempt_id":"attemptId","credential_id":"credentialId","etag":"etag","execution_id":"executionId","goal_version_id":"goalVersionId","grant_id":"grantId","invitation_id":"invitationId","meal_id":"mealId","organization_id":"organizationId","person_id":"personId","planned_session_id":"plannedSessionId","program_id":"programId","relationship_id":"relationshipId","version_id":"programVersionId"};
        const visit = (value) => {
          if (!value || typeof value !== "object") return;
          for (const [key, child] of Object.entries(value)) {
            if (captures[key] && typeof child === "string") pm.variables.set(captures[key], child);
            visit(child);
          }
        };
        visit(payload);
      }
    language: text/javascript
order: 4000
