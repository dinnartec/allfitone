$kind: http-request
id: df5d3cc9-7bf7-4e88-b282-b8b973fdf2ab
description: |-
  **GET /studio/v1/professional-credential-types**

  Contrato: List published professional credential types in governed order.

  Usa únicamente datos sintéticos en el entorno local.
url: "{{baseUrl}}/studio/v1/professional-credential-types"
method: GET
headers:
  "If-None-Match": "string"
  "Accept": "application/json, application/problem+json"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status esperado: 200", () => pm.response.to.have.status(200));
      const contentType = (pm.response.headers.get('Content-Type') || '').toLowerCase();
      if (pm.response.code >= 400) {
        pm.test('Los errores usan Problem Details', () => {
          pm.expect(contentType).to.include('application/problem+json');
          const problem = pm.response.json();
          pm.expect(problem).to.have.property('type');
          pm.expect(problem).to.have.property('title');
          pm.expect(problem).to.have.property('status', pm.response.code);
        });
      }
      const responseEtag = pm.response.headers.get('ETag');
      if (responseEtag && pm.environment) pm.environment.set('etag', responseEtag);
      if (contentType.includes('json') && pm.response.text()) {
        const payload = pm.response.json();
        const captures = { attempt_id: 'attemptId', attemptId: 'attemptId', credential_id: 'credentialId', credentialId: 'credentialId', organization_id: 'organizationId', organizationId: 'organizationId', invitation_id: 'invitationId', invitationId: 'invitationId', access_token: 'spaceAccessToken', accessToken: 'spaceAccessToken' };
        const visit = (value) => {
          if (!value || typeof value !== 'object') return;
          for (const [key, child] of Object.entries(value)) {
            if (captures[key] && typeof child === 'string' && pm.environment) pm.environment.set(captures[key], child);
            visit(child);
          }
        };
        visit(payload);
      }
      if (contentType.includes('json') && pm.response.code < 400) {
        const catalog = pm.response.json();
        const first = Array.isArray(catalog) ? catalog[0] : (catalog.items || catalog.data || [])[0];
        if (first?.code && pm.environment) pm.environment.set('credentialTypeCode', first.code);
      }
    language: text/javascript
order: 2000
