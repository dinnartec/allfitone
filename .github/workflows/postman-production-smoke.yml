name: Postman Production Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Run on-demand production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run the disabled-by-default Postman monitor once
        uses: postmanlabs/postman-cli-action@v1
        with:
          command: 'monitor run ${{ vars.POSTMAN_SMOKE_MONITOR_ID }} --timeout 60000'
          api-key: ${{ secrets.POSTMAN_API_KEY }}
