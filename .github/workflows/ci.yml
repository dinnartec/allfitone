# Continuous integration.
#
# Runs every check that AGENTS.md section 14 requires before merging. The git
# hooks cover the same ground locally, but hooks live on a developer's machine —
# this is the gate that actually holds.
#
# Database integration checks run separately because they need the local
# Supabase stack and must always tear it down, even when a gate fails.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run tells you nothing. Cancel it and save the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so commitlint can see the pushed range.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: OpenAPI
        run: bun run check:openapi

      - name: Generated contracts
        run: bun run check:contracts

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The commit-msg hook covers local commits, but a push from a machine
      # without hooks installed would slip through. This closes that gap.
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Install
        run: bun install --frozen-lockfile

      - name: Database policy
        env:
          DB_POLICY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun run check:db-policy -- --base "$DB_POLICY_BASE_SHA"

      - name: Start Supabase
        run: bun run db:start

      - name: Reset database
        run: bun run db:reset

      - name: Lint database
        run: bun run db:lint

      - name: Test database
        run: bun run db:test

      - name: Test database concurrency
        run: bun run db:test:concurrency

      - name: Generated database types
        run: bun run check:db-types

      - name: Stop Supabase
        if: always()
        run: bun run db:stop

  studio-e2e:
    name: Studio E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build Studio workspace dependencies
        run: bun run --cwd packages/telemetry build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test Studio interactions
        run: bun run --cwd apps/studio-web test:e2e

  postman:
    name: Postman
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate the development collection
        run: bun run check:postman

      - name: Lint Development
        uses: postmanlabs/postman-cli-action@v1
        with:
          working-directory: 'postman/collections/AllFit One - Development'
          command: 'collection lint . --fail-severity warning'

  postman-publish:
    name: Publish Postman Cloud View
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, database, studio-e2e, postman]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Install
        run: bun install --frozen-lockfile

      - name: Publish the development workspace
        uses: postmanlabs/postman-cli-action@v1
        with:
          command: 'workspace push --yes'
          api-key: ${{ secrets.POSTMAN_API_KEY }}
