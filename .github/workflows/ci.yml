# Continuous integration.
#
# Runs every check that AGENTS.md section 14 requires before merging. The git
# hooks cover the same ground locally, but hooks live on a developer's machine —
# this is the gate that actually holds.
#
# Database integration checks run separately because they need the local
# Supabase stack and must always tear it down, even when a gate fails.

name: CI

# Pull requests only. GitHub checks the merge preview, so a run on main after
# the merge validates a tree that was already green, and nothing here depends on
# a CI result for a main commit — `Deploy database` is dispatched by hand.
#
# The trade-off is real: two pull requests that pass alone can break together.
# Requiring branches to be up to date before merging closes that, and costs
# nothing. Restore `push: branches: [main]` if this ever bites.
on:
  pull_request:

# A superseded run tells you nothing. Cancel it and save the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of the heavy jobs this change actually needs. Roughly twenty
  # seconds of Linux that can save fifteen minutes of Supabase and Playwright.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      database: ${{ steps.changed.outputs.database }}
      studio: ${{ steps.changed.outputs.studio }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A push whose before-sha is unknown — a new branch, or a force push —
          # cannot be diffed, so everything runs rather than silently skipping.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "database=true" >> "$GITHUB_OUTPUT"
            echo "studio=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "$FILES"

          database=false
          studio=false

          # The workflow itself counts: a change to these rules has to prove it.
          if echo "$FILES" | grep -qE '^(packages/db/|packages/contracts/|\.github/workflows/|package\.json|bun\.lock|turbo\.json)'; then
            database=true
          fi
          if echo "$FILES" | grep -qE '^(apps/studio-web/|packages/telemetry/|packages/contracts/|\.github/workflows/|package\.json|bun\.lock)'; then
            studio=true
          fi

          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "studio=$studio" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so commitlint can see the pushed range.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: OpenAPI
        run: bun run check:openapi

      - name: Generated contracts
        run: bun run check:contracts

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The commit-msg hook covers local commits, but a push from a machine
      # without hooks installed would slip through. This closes that gap.
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  database:
    name: Database
    needs: scope
    if: needs.scope.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Install
        run: bun install --frozen-lockfile

      - name: Database policy
        env:
          DB_POLICY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun run check:db-policy -- --base "$DB_POLICY_BASE_SHA"

      - name: Start Supabase
        run: bun run db:start

      - name: Reset database
        run: bun run db:reset

      - name: Lint database
        run: bun run db:lint

      - name: Test database
        run: bun run db:test

      - name: Test database concurrency
        run: bun run db:test:concurrency

      - name: Generated database types
        run: bun run check:db-types

      - name: Stop Supabase
        if: always()
        run: bun run db:stop

  studio-e2e:
    name: Studio E2E
    needs: scope
    if: needs.scope.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build Studio workspace dependencies
        run: bun run --cwd packages/telemetry build

      # Downloading the browser on every run costs more than storing it.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test Studio interactions
        run: bun run --cwd apps/studio-web test:e2e
