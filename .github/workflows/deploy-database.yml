name: Deploy database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-production

    steps:
      - uses: actions/checkout@v4

      - name: Require main
        run: test "$GITHUB_REF_NAME" = main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate database policy
        run: bun run check:db-policy

      # There is no shared staging database yet, so production promotion repeats
      # the complete local database gate before any remote credentials are used.
      - name: Start local Supabase
        run: bun run db:start

      - name: Reset local database
        run: bun run db:reset

      - name: Lint local database
        run: bun run db:lint

      - name: Test local database
        run: bun run db:test

      - name: Test local database concurrency
        run: bun run db:test:concurrency

      # Same preload as the Database job in ci.yml, and here it matters more:
      # this step is the last local gate before production credentials are used,
      # so an image pull that fails stops the whole deploy. That is what happened
      # on 2026-10-05 (run 37266771279) — the database stayed 19 migrations
      # behind for a day over a registry limit, not a defect.
      #
      # postgres-meta is pulled from public.ecr.aws, which limits anonymous
      # pulls. The same image — identical layer digests — is on Docker Hub, so
      # take it there and tag it with the name the Supabase CLI looks for; the
      # CLI then finds it already on the machine and never calls ECR.
      #
      # The tag belongs to the CLI pinned in package.json ("supabase":
      # "2.110.0"). If a CLI bump asks for a different one, this turns into a
      # no-op and the CLI pulls from ECR as before, which is what
      # continue-on-error protects: this step must never be what fails a deploy.
      - name: Preload the type generator image
        continue-on-error: true
        run: |
          image=supabase/postgres-meta:v0.96.6
          docker pull "$image"
          docker tag "$image" "public.ecr.aws/$image"

      - name: Validate generated database types
        run: bun run check:db-types

      - name: Stop local Supabase
        if: always()
        run: bun run db:stop

      - name: Validate deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ADMIN_DATABASE_URL: ${{ secrets.SUPABASE_ADMIN_DATABASE_URL }}
          ALLFIT_API_DB_PASSWORD: ${{ secrets.ALLFIT_API_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_ADMIN_DATABASE_URL"
          test -n "$ALLFIT_API_DB_PASSWORD"

      - name: Link target project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: >-
          bunx supabase link
          --project-ref "$SUPABASE_PROJECT_REF"
          --password "$SUPABASE_DB_PASSWORD"
          --workdir packages/db
          --yes

      - name: Show pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bunx supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" --workdir packages/db

      - name: Dry-run migration deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bunx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --workdir packages/db --dry-run

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bunx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --workdir packages/db --yes

      - name: Configure runtime database role
        env:
          SUPABASE_ADMIN_DATABASE_URL: ${{ secrets.SUPABASE_ADMIN_DATABASE_URL }}
          ALLFIT_API_DB_PASSWORD: ${{ secrets.ALLFIT_API_DB_PASSWORD }}
        run: |
          psql "$SUPABASE_ADMIN_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --set=role_password="$ALLFIT_API_DB_PASSWORD" <<'SQL'
          alter role allfit_api password :'role_password';
          SQL

      - name: Verify migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bunx supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" --workdir packages/db
