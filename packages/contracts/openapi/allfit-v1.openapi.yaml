components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: allfit_studio_session
      description: Opaque, host-only, HttpOnly Studio browser-session cookie.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: WorkOS AuthKit access token validated for the selected surface.
    backofficeAttemptAuth:
      type: apiKey
      in: cookie
      name: allfit_backoffice_auth_attempt
      description: Opaque, host-only, HttpOnly temporary Backoffice authentication attempt.
    backofficeCookieAuth:
      type: apiKey
      in: cookie
      name: allfit_backoffice_session
      description: Opaque, host-only, HttpOnly AAL2 Backoffice session.

  parameters:
    BreakGlassRequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    BreakGlassMine:
      name: mine
      in: query
      required: false
      description: Only your own requests. Absent means the whole tray.
      schema:
        type: boolean
    BreakGlassStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BreakGlassStatus'
    SupportOperationSource:
      name: source
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SupportOperationSourceKind'
    SupportOperationState:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SupportOperationState'
    OrganizationSearch:
      name: q
      in: query
      required: false
      description: >-
        Part of an organization's display name, matched literally. At least two
        characters, so a search is a question rather than a way to page everything.
      schema:
        type: string
        minLength: 2
        maxLength: 120
    OrganizationLifecycleFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OrganizationLifecycleStatus'
    AccessEventActor:
      name: actor_person_id
      in: query
      required: false
      description: The team member whose accesses are being reviewed.
      schema:
        $ref: '#/components/schemas/Uuid'
    AccessEventSubject:
      name: subject_person_id
      in: query
      required: false
      description: The person whose data was accessed.
      schema:
        $ref: '#/components/schemas/Uuid'
    AccessEventFrom:
      name: from
      in: query
      required: false
      description: Inclusive lower bound on when the access happened.
      schema:
        type: string
        format: date-time
    AccessEventTo:
      name: to
      in: query
      required: false
      description: Exclusive upper bound on when the access happened.
      schema:
        type: string
        format: date-time
    SupportAggregateId:
      name: aggregate_id
      in: query
      required: false
      description: >-
        The aggregate an event belongs to. Not every event is reachable from a
        person: a notification about an invitation belongs to the invitation.
      schema:
        $ref: '#/components/schemas/Uuid'
    SupportCaseReference:
      name: case_reference
      in: query
      required: true
      description: >-
        The case this read belongs to. A structured reference rather than free
        prose, so the record can be followed back to a case months later.
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9_-]{2,63}$'
    SupportPersonId:
      name: personId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SupportLookupIdentifier:
      name: identifier
      in: query
      required: false
      description: Exactly one lookup parameter is accepted per search.
      schema:
        $ref: '#/components/schemas/Uuid'
    SupportLookupEmail:
      name: email
      in: query
      required: false
      description: Exact match only. Exactly one lookup parameter is accepted per search.
      schema:
        type: string
        format: email
        maxLength: 254
    SupportLookupPhone:
      name: phone
      in: query
      required: false
      description: Exact match only. Exactly one lookup parameter is accepted per search.
      schema:
        type: string
        pattern: '^\+[1-9][0-9]{6,14}$'
    OnboardingAttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    VersionNumber:
      name: versionNumber
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PlannedSessionId:
      name: plannedSessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MealId:
      name: mealId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GoalVersionId:
      name: goalVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CatalogActivityTypeId:
      name: activityTypeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ResultContractId:
      name: contractId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    PlatformPersonFilter:
      name: person_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
    PlatformDutyFilter:
      name: duty_code
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PlatformDutyCode'
    PlatformDutyStatusFilter:
      name: status
      in: query
      required: false
      description: Filters on the effective state, so `expired` reflects the clock, not a job.
      schema:
        type: string
        enum: [scheduled, active, suspended, expired, revoked]
    PlatformAssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUIDv4 reused only for HTTP retries of this operation.
      schema:
        $ref: '#/components/schemas/UuidV4'
    CommandId:
      name: Command-Id
      in: header
      required: true
      description: UUIDv7 durable identity generated when the user intention is created.
      schema:
        $ref: '#/components/schemas/UuidV7'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag for the execution revision used as the command base.
      schema:
        type: string
        pattern: '^"execution:[0-9a-f-]{36}:r[0-9]+"$'
    PlanningDraftIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong content ETag returned with the current editable draft.
      schema:
        type: string
        pattern: '^"sha256:[A-Za-z0-9_-]{43}"$'
    OrganizationIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag for the organization revision used as the command base.
      schema:
        type: string
        pattern: '^"organization:[0-9a-f-]{36}:r[0-9]+"$'
    OrganizationSiteIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag for the organization site revision used as the command base.
      schema:
        type: string
        pattern: '^"organization-site:[0-9a-f-]{36}:r[0-9]+"$'
    NutritionMealIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag for the nutrition meal revision used as the command base.
      schema:
        type: string
        pattern: '^"nutrition-meal:[0-9a-f-]{36}:r[0-9]+"$'
    HistoricalAccessCase:
      name: X-Historical-Access-Case
      in: header
      required: false
      description: Opaque case UUID. When present the endpoint uses only the frozen guidance projection.
      schema:
        $ref: '#/components/schemas/Uuid'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 160
    FromDate:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      required: true
      description: Inclusive date; range from..to must not exceed 31 days.
      schema:
        type: string
        format: date
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 1024

  headers:
    NoStore:
      required: true
      schema:
        type: string
        const: no-store
    PrivateNoStore:
      required: true
      schema:
        type: string
        const: private, no-store
    PrivateRevalidate:
      required: true
      schema:
        type: string
        const: private, max-age=0, must-revalidate
    ETag:
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 160
    Location:
      required: true
      schema:
        type: string
        format: uri-reference
    IdempotentReplay:
      required: false
      description: Present and true only when the minimal outcome is replayed.
      schema:
        type: string
        const: 'true'
    RetryAfter:
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 30
    SetCookie:
      required: true
      description: Sets or clears an HttpOnly browser cookie; its value is always opaque.
      schema:
        type: string

  responses:
    BadRequest:
      description: Missing/invalid headers or malformed request
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/idempotency-key-required
            title: Idempotency-Key is required
            status: 400
            request_id: 01JEXAMPLE0000000000000000
    UnsupportedMediaType:
      description: >-
        A command that declares a request body received a representation other
        than application/json, or a command that declares none received a payload
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/unsupported-media-type
            title: Content-Type must be application/json
            status: 415
            request_id: 01JEXAMPLE0000000000000000
    Unauthenticated:
      description: Missing, invalid or expired token
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/unauthenticated
            title: Authentication is required
            status: 401
            request_id: 01JEXAMPLE0000000000000000
    Forbidden:
      description: Authenticated actor cannot execute the operation
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/forbidden
            title: The actor cannot execute this operation
            status: 403
            request_id: 01JEXAMPLE0000000000000000
    AccountClosed:
      description: The person linked to the authenticated account is closed
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/account-closed
            title: The account is closed
            status: 403
            request_id: 01JEXAMPLE0000000000000000
    RegistrationIncomplete:
      description: The authenticated Studio account has not completed registration
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/registration-incomplete
            title: Registration must be completed first
            status: 403
            request_id: 01JEXAMPLE0000000000000000
    TooManyRequests:
      description: >-
        Rate limit exceeded. Mandatory on the authentication surface: without it a
        six-digit verification code is brute-forceable, and repeated registration
        attempts become a way to enumerate addresses by timing.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpstreamUnavailable:
      description: An authentication dependency is temporarily unavailable
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/upstream-unavailable
            title: Authentication is temporarily unavailable
            status: 503
            request_id: 01JEXAMPLE0000000000000000
    RateLimited:
      description: A closed abuse-prevention limit rejected the request
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/rate-limited
            title: Too many invitation attempts
            status: 429
            request_id: 01JEXAMPLE0000000000000000
    ScopeRequired:
      description: Required live grant is not effective
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/scope-required
            title: Required consent is not effective
            status: 403
            request_id: 01JEXAMPLE0000000000000000
            required_scope:
              code: relationship_training
              level: read
    NotFound:
      description: Resource absent or not visible to the actor
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/not-found
            title: Resource not found
            status: 404
            request_id: 01JEXAMPLE0000000000000000
    Conflict:
      description: Concurrent conflict or idempotency identity reuse
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/idempotency-in-progress
            title: The command is still in progress
            status: 409
            request_id: 01JEXAMPLE0000000000000000
    OrganizationCommandConflict:
      description: Stale revision, idempotency conflict, or a bounded command lock timeout
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StaleDraft:
      description: If-Match refers to a stale execution revision
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/stale-draft
            title: The local draft is stale
            status: 409
            request_id: 01JEXAMPLE0000000000000000
    PreconditionRequired:
      description: If-Match is required
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/precondition-required
            title: If-Match is required
            status: 428
            request_id: 01JEXAMPLE0000000000000000
    ValidationFailed:
      description: Request violates its closed schema or business validation
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/validation-failed
            title: The request does not satisfy the contract
            status: 422
            request_id: 01JEXAMPLE0000000000000000
            errors:
              - code: required
                path: /started_at
                message: started_at is required.
    ContractValidationFailed:
      description: Execution results do not satisfy the frozen result contract
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/contract-validation-failed
            title: The execution does not satisfy its frozen result contract
            status: 422
            request_id: 01JEXAMPLE0000000000000000
            errors:
              - code: required
                path: /strength_sets/0/achieved_reps
                message: The detailed contract requires achieved repetitions.
    CommandEffectDisposed:
      description: The command already ran but its effect was disposed
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/command-effect-disposed
            title: The command effect was disposed
            status: 410
            request_id: 01JEXAMPLE0000000000000000

  schemas:
    ScopeResourceRule:
      type: object
      additionalProperties: false
      description: >-
        One resource and field the version speaks about. An exclusion is stated
        rather than left out, because criterion 1 asks what a permission excludes
        and an absence cannot answer that.
      required: [resource, field, data_classification_code, max_action]
      properties:
        resource:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
        field:
          type: string
          description: A field name, or `*` for every field of the resource.
          maxLength: 64
        data_classification_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
        max_action:
          $ref: '#/components/schemas/AccessLevel'
        is_excluded:
          type: boolean
          default: false
        historical_readable:
          type: boolean
          default: false
          description: >-
            Whether the field may be read for periods before the grant existed.
            Only valid on an included, read-only field.
    ScopeDefinition:
      type: object
      additionalProperties: false
      required: [id, scope_code, version_number, status, published_at, rules]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        scope_code:
          $ref: '#/components/schemas/ScopeCode'
        version_number:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/PublicationStatus'
        published_at:
          type: [string, 'null']
          format: date-time
        rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ScopeResourceRule'
    ScopeDefinitionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScopeDefinition'
    ScopeDefinitionPublication:
      type: object
      additionalProperties: false
      description: >-
        No version number: the server assigns the next one. At least one rule must
        be included, because a version made only of exclusions grants nothing.
      required: [scope_code, rules]
      properties:
        scope_code:
          $ref: '#/components/schemas/ScopeCode'
        rules:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/ScopeResourceRule'
    BreakGlassCategory:
      type: string
      description: >-
        The approvable categories. Everything else — media, identity, contact,
        secrets, payments, raw sensor data — is not a category with a higher bar:
        it can never be approved.
      enum:
        - relationship_training
        - prior_training_history
        - nutrition_guidance
        - body_progress
        - health_context
        - nutrition_intake
    BreakGlassPurpose:
      type: string
      description: >-
        Five closed purposes. There is deliberately no `other`: marketing,
        commercial recovery, AI training and operational curiosity are not
        purposes, and an open field would become all four.
      enum:
        - service_dispute
        - legal_or_regulatory_obligation
        - customer_support_request
        - security_investigation
        - authorized_quality_review
    BreakGlassTier:
      type: string
      description: Derived from the categories by the server, never sent by a client.
      enum: [standard, restricted]
    BreakGlassStatus:
      type: string
      enum: [requested, approved, rejected, closed, expired]
    OrganizationLifecycleStatus:
      type: string
      description: >-
        `unclaimed` exists but does not operate: Allfit created it and its owner has
        not accepted yet. `cancelled` was never claimed. `closed` operated and
        ended.
      enum: [unclaimed, active, closed, cancelled]
    BackofficeOrganizationSummary:
      type: object
      additionalProperties: false
      description: >-
        An organization as the directory shows it. Nothing here identifies a person:
        no legal name and no responsible party.
      required:
        - organization_id
        - display_name
        - type_code
        - type_name
        - status
        - created_at
        - claimed_at
        - cancelled_at
        - active_member_count
        - site_count
        - people_served
      properties:
        organization_id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
        type_code:
          type: string
        type_name:
          type: string
        status:
          $ref: '#/components/schemas/OrganizationLifecycleStatus'
        created_at:
          type: string
          format: date-time
        claimed_at:
          type: [string, 'null']
          format: date-time
        cancelled_at:
          type: [string, 'null']
          format: date-time
        active_member_count:
          type: integer
          minimum: 0
        site_count:
          type: integer
          minimum: 0
        people_served:
          type: [integer, 'null']
          minimum: 0
          description: >-
            Null until service relationships exist. Not zero, because zero would say
            the organization serves nobody.
    BackofficeOrganizationPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BackofficeOrganizationSummary'
        page:
          $ref: '#/components/schemas/Page'
    ModelAvailability:
      type: string
      description: >-
        `not_modelled` means the platform has no table for this yet. It is a fact about
        Allfit, never about the organization or the person.
      enum: [not_modelled]
    BackofficeOrganizationFile:
      type: object
      additionalProperties: false
      required:
        - organization
        - owner
        - team
        - team_counts
        - team_truncated
        - sites
        - people_served
        - plans_availability
        - payment_method_availability
        - premium_availability
      properties:
        organization:
          type: object
          additionalProperties: false
          required:
            - organization_id
            - display_name
            - type_code
            - type_name
            - status
            - party_kind
            - legal_name
            - created_at
            - claimed_at
            - cancelled_at
          properties:
            organization_id:
              $ref: '#/components/schemas/Uuid'
            display_name:
              type: string
            type_code:
              $ref: '#/components/schemas/OrganizationTypeCode'
            type_name:
              type: string
            status:
              $ref: '#/components/schemas/OrganizationLifecycleStatus'
            party_kind:
              $ref: '#/components/schemas/OrganizationPartyKind'
            legal_name:
              type: [string, 'null']
              description: A company's legal name. Always null for a natural person.
            created_at:
              type: string
              format: date-time
            claimed_at:
              type: [string, 'null']
              format: date-time
            cancelled_at:
              type: [string, 'null']
              format: date-time
        owner:
          type: [object, 'null']
          additionalProperties: false
          required: [person_id, membership_id, since]
          properties:
            person_id:
              $ref: '#/components/schemas/Uuid'
            membership_id:
              $ref: '#/components/schemas/Uuid'
            since:
              type: string
              format: date-time
        team:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [membership_id, person_id, roles, joined_at]
            properties:
              membership_id:
                $ref: '#/components/schemas/Uuid'
              person_id:
                $ref: '#/components/schemas/Uuid'
              roles:
                type: array
                items:
                  type: string
                  enum: [owner, admin, coach, staff]
              joined_at:
                type: string
                format: date-time
        team_counts:
          type: object
          additionalProperties: false
          required: [active, terminated]
          properties:
            active:
              type: integer
              minimum: 0
            terminated:
              type: integer
              minimum: 0
        team_truncated:
          type: boolean
          description: True when the team has more active members than the file lists.
        sites:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [site_id, name, address, address_withheld, status]
            properties:
              site_id:
                $ref: '#/components/schemas/Uuid'
              name:
                type: string
              address:
                type: [string, 'null']
              address_withheld:
                type: boolean
                description: A natural person's address is withheld, because it can be their home.
              status:
                type: string
                enum: [active, inactive]
        people_served:
          type: [integer, 'null']
          minimum: 0
          description: Null until service relationships exist. Never zero in their place.
        plans_availability:
          $ref: '#/components/schemas/ModelAvailability'
        payment_method_availability:
          $ref: '#/components/schemas/ModelAvailability'
        premium_availability:
          $ref: '#/components/schemas/ModelAvailability'
    OrganizationPartyKind:
      type: string
      description: >-
        Whether the organization answers as a company or as a natural person. A
        natural person's name is never written by Allfit.
      enum: [natural_person, legal_entity]
    OrganizationHandoverCreate:
      type: object
      additionalProperties: false
      required: [display_name, type_code, party_kind, owner_email]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        type_code:
          $ref: '#/components/schemas/OrganizationTypeCode'
        party_kind:
          $ref: '#/components/schemas/OrganizationPartyKind'
        legal_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 160
          description: Required for a company and refused for a natural person.
        site:
          type: [object, 'null']
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            address:
              type: [string, 'null']
              minLength: 1
              maxLength: 240
        owner_email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
    OrganizationHandover:
      type: object
      additionalProperties: false
      required:
        - organization_id
        - display_name
        - type_code
        - type_name
        - party_kind
        - legal_name
        - status
        - created_at
        - claimed_at
        - cancelled_at
        - site
        - invitation
      properties:
        organization_id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
        type_code:
          $ref: '#/components/schemas/OrganizationTypeCode'
        type_name:
          type: string
        party_kind:
          $ref: '#/components/schemas/OrganizationPartyKind'
        legal_name:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/OrganizationLifecycleStatus'
        created_at:
          type: string
          format: date-time
        claimed_at:
          type: [string, 'null']
          format: date-time
        cancelled_at:
          type: [string, 'null']
          format: date-time
        site:
          type: [object, 'null']
          additionalProperties: false
          required: [site_id, name, address]
          properties:
            site_id:
              $ref: '#/components/schemas/Uuid'
            name:
              type: string
            address:
              type: [string, 'null']
        invitation:
          type: [object, 'null']
          additionalProperties: false
          required: [invitation_id, status, intent_status, contact_hint, expires_at]
          description: The latest ownership invitation. The address is a hint, never the address.
          properties:
            invitation_id:
              $ref: '#/components/schemas/Uuid'
            status:
              $ref: '#/components/schemas/TeamInvitationStatus'
            intent_status:
              $ref: '#/components/schemas/TeamInvitationIntentStatus'
            contact_hint:
              type: string
            expires_at:
              type: string
              format: date-time
    CredentialVerificationMethod:
      type: string
      description: >-
        How a credential was checked. Documents, civil identity, health and a
        complete profile are never verifiable in V1, so no method exists for them.
      enum: [official_registry_lookup, issuer_confirmation]
    CredentialVerificationResult:
      type: string
      description: >-
        What a verifier may record. There is no default, and `unverifiable` is the
        answer whenever the evidence does not reach.
      enum: [verified, rejected, unverifiable]
    CredentialVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - request_id
        - kind
        - requested_at
        - credential_id
        - credential_type_code
        - credential_type_name
        - issuer
        - credential_name
        - credential_identifier
        - issued_on
        - expires_on
        - verification_url
        - holder_person_id
        - holder_given_name
        - holder_family_name
        - suggested_method
        - previous_result
        - previous_valid_to
        - viewer_can_decide
      properties:
        request_id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum: [initial, renewal]
        requested_at:
          type: string
          format: date-time
        credential_id:
          $ref: '#/components/schemas/Uuid'
        credential_type_code:
          type: string
        credential_type_name:
          type: string
        issuer:
          type: string
        credential_name:
          type: string
        credential_identifier:
          type: [string, 'null']
        issued_on:
          type: [string, 'null']
          format: date
        expires_on:
          type: [string, 'null']
          format: date
        verification_url:
          type: [string, 'null']
          format: uri
        holder_person_id:
          $ref: '#/components/schemas/Uuid'
        holder_given_name:
          type: string
        holder_family_name:
          type: string
        suggested_method:
          $ref: '#/components/schemas/CredentialVerificationMethod'
        previous_result:
          type: [string, 'null']
          description: The latest result recorded for this exact version, so a renewal shows what it renews.
        previous_valid_to:
          type: [string, 'null']
          format: date-time
        viewer_can_decide:
          type: boolean
          description: >-
            A hint for the screen, never authority. False when the caller is the
            holder or shares an active organization with them.
    CredentialVerificationRequestList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialVerificationRequest'
    CredentialVerificationDecisionCreate:
      type: object
      additionalProperties: false
      description: >-
        No policy, no validity and no evidence fingerprint: the server derives all
        three, so a client cannot decide how long its own verification lasts.
      required:
        - request_id
        - result
        - method
        - source_authority
        - source_jurisdiction
        - source_reference
        - source_status
        - source_checked_at
      properties:
        request_id:
          $ref: '#/components/schemas/Uuid'
        result:
          $ref: '#/components/schemas/CredentialVerificationResult'
        method:
          $ref: '#/components/schemas/CredentialVerificationMethod'
        source_authority:
          type: string
          minLength: 1
          maxLength: 200
        source_jurisdiction:
          type: string
          minLength: 1
          maxLength: 200
        source_reference:
          type: string
          minLength: 1
          maxLength: 200
          description: Kept as evidence and never returned by any read.
        source_status:
          type: string
          minLength: 1
          maxLength: 200
        source_checked_at:
          type: string
          format: date-time
        source_valid_to:
          type: [string, 'null']
          format: date-time
    CredentialVerificationRecord:
      type: object
      additionalProperties: false
      required: [id, result, method, decided_at, valid_from, valid_to]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        result:
          type: string
          enum: [verified, rejected, unverifiable, revoked]
        method:
          $ref: '#/components/schemas/CredentialVerificationMethod'
        decided_at:
          type: string
          format: date-time
        valid_from:
          type: [string, 'null']
          format: date-time
        valid_to:
          type: [string, 'null']
          format: date-time
    CredentialVerificationOutcome:
      type: object
      additionalProperties: false
      description: The outcome, never the evidence — no registry reference and no fingerprint.
      required: [request_id, kind, status, credential_id, created_at, resolved_at, verification]
      properties:
        request_id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum: [initial, renewal]
        status:
          type: string
          enum: [pending, resolved, cancelled]
        credential_id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, 'null']
          format: date-time
        verification:
          anyOf:
            - $ref: '#/components/schemas/CredentialVerificationRecord'
            - type: 'null'
    CredentialRenewalDue:
      type: object
      additionalProperties: false
      required:
        - credential_id
        - credential_type_code
        - credential_type_name
        - credential_name
        - issuer
        - holder_person_id
        - holder_given_name
        - holder_family_name
        - last_valid_to
      properties:
        credential_id:
          $ref: '#/components/schemas/Uuid'
        credential_type_code:
          type: string
        credential_type_name:
          type: string
        credential_name:
          type: string
        issuer:
          type: string
        holder_person_id:
          $ref: '#/components/schemas/Uuid'
        holder_given_name:
          type: string
        holder_family_name:
          type: string
        last_valid_to:
          type: string
          format: date-time
    CredentialRenewalDueList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialRenewalDue'
    CredentialRenewalCreate:
      type: object
      additionalProperties: false
      required: [credential_id]
      properties:
        credential_id:
          $ref: '#/components/schemas/Uuid'
    AccessMode:
      type: string
      description: >-
        How the access was authorised. `break_glass` is the exceptional path and
        is the only one subject to the per-case auditor disqualification.
      enum: [live, frozen, break_glass, organization_operational, support_metadata]
    AccessEvent:
      type: object
      additionalProperties: false
      description: >-
        The record of one access. It never carries what was read: the table it
        comes from has no content columns, and the closed query returns this exact
        shape.
      required:
        - actor_person_id
        - subject_person_id
        - resource
        - resource_id
        - purpose
        - result
        - scope_code
        - scope_version
        - access_mode
        - occurred_at
      properties:
        actor_person_id:
          $ref: '#/components/schemas/Uuid'
        subject_person_id:
          type: [string, 'null']
          format: uuid
        resource:
          type: string
          description: The kind of data that was read, such as `nutrition.intake_entries`.
        resource_id:
          type: [string, 'null']
          format: uuid
        purpose:
          type: string
        result:
          type: string
          enum: [allowed, denied]
        scope_code:
          type: [string, 'null']
        scope_version:
          type: [integer, 'null']
        access_mode:
          $ref: '#/components/schemas/AccessMode'
        occurred_at:
          type: string
          format: date-time
    AccessEventPage:
      type: object
      additionalProperties: false
      required: [items, withheld_from_you]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessEvent'
        withheld_from_you:
          type: integer
          minimum: 0
          description: >-
            How many records matching these filters were removed because this
            auditor requested or approved the break-glass window they belong to.
            Reported separately from the list so that it survives an empty one.
    BreakGlassApproval:
      type: object
      additionalProperties: false
      required: [approver_person_id, decision, reason_code, decided_at]
      properties:
        approver_person_id:
          $ref: '#/components/schemas/Uuid'
        decision:
          type: string
          enum: [approved, rejected]
        reason_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{2,63}$'
        decided_at:
          type: string
          format: date-time
    BreakGlassRequest:
      type: object
      additionalProperties: false
      description: >-
        The file. It carries metadata about purpose and subject, and never the
        person's content.
      required:
        - id
        - requester_person_id
        - subject_person_id
        - categories
        - purpose
        - case_reference
        - sensitivity_tier
        - required_approvals
        - requested_duration_minutes
        - requested_at
        - request_expires_at
        - status
        - window_starts_at
        - window_ends_at
        - closed_at
        - reviewed_at
        - review_outcome
        - approvals
        - exercise_count
        - viewer_is_requester
        - viewer_can_decide
        - viewer_can_exercise
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        requester_person_id:
          $ref: '#/components/schemas/Uuid'
        subject_person_id:
          $ref: '#/components/schemas/Uuid'
        categories:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BreakGlassCategory'
        purpose:
          $ref: '#/components/schemas/BreakGlassPurpose'
        case_reference:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{2,63}$'
        sensitivity_tier:
          $ref: '#/components/schemas/BreakGlassTier'
        required_approvals:
          type: integer
          minimum: 1
          maximum: 2
        requested_duration_minutes:
          type: integer
          minimum: 1
          maximum: 30
        requested_at:
          type: string
          format: date-time
        request_expires_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BreakGlassStatus'
        window_starts_at:
          type: [string, 'null']
          format: date-time
        window_ends_at:
          type: [string, 'null']
          format: date-time
        closed_at:
          type: [string, 'null']
          format: date-time
        reviewed_at:
          type: [string, 'null']
          format: date-time
        review_outcome:
          type: [string, 'null']
          enum: [justified, unjustified, incident_opened, null]
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/BreakGlassApproval'
        exercise_count:
          type: integer
          minimum: 0
        viewer_is_requester:
          type: boolean
          description: >-
            Whether the caller opened this file. The Backoffice session carries no
            domain identifier, so the server answers this rather than the client
            re-deriving it from one.
        viewer_can_decide:
          type: boolean
          description: >-
            A hint for the screen, never authority: it saves offering a button that
            would always be refused. Every command revalidates on its own.
        viewer_can_exercise:
          type: boolean
          description: A hint for the screen, on the same terms as `viewer_can_decide`.
    BreakGlassRequestList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BreakGlassRequest'
    BreakGlassRequestCreate:
      type: object
      additionalProperties: false
      description: >-
        No tier, no approval count and no duration: the server derives all three
        from the categories.
      required: [subject_person_id, categories, purpose, case_reference]
      properties:
        subject_person_id:
          $ref: '#/components/schemas/Uuid'
        categories:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/BreakGlassCategory'
        purpose:
          $ref: '#/components/schemas/BreakGlassPurpose'
        case_reference:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{2,63}$'
    BreakGlassDecision:
      type: object
      additionalProperties: false
      required: [decision, reason_code]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reason_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{2,63}$'
    BreakGlassExercise:
      type: object
      additionalProperties: false
      required: [category, resource_type]
      properties:
        category:
          $ref: '#/components/schemas/BreakGlassCategory'
        resource_type:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
        resource_id:
          type: [string, 'null']
          format: uuid
    BreakGlassExerciseOutcome:
      type: object
      additionalProperties: false
      description: >-
        Every attempt is recorded before this answers, so `break_glass_event_id`
        is the evidence of this exact attempt. No outcome carries content in this
        version.
      required: [outcome, reason_code, break_glass_event_id, occurred_at]
      properties:
        outcome:
          type: string
          enum: [denied, content_unavailable]
        reason_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
        break_glass_event_id:
          $ref: '#/components/schemas/Uuid'
        occurred_at:
          type: string
          format: date-time
        category:
          $ref: '#/components/schemas/BreakGlassCategory'
    SupportOperationSourceKind:
      type: string
      enum: [notification, command]
    SupportOperationState:
      type: string
      description: >-
        `pending` is a notification not sent yet and `retrying` one that already
        failed, kept apart so a healthy queue does not read as a pile of
        failures. `stalled` is a command still processing long after it started.
      enum:
        - pending
        - retrying
        - delivered
        - dead_lettered
        - processing
        - stalled
        - succeeded
        - rejected_final
    SupportOperation:
      type: object
      additionalProperties: false
      description: >-
        Identifiers, states, timestamps, error codes and retries. No payload, no
        stored response, no principal fingerprint and no request hash: this read
        exists to diagnose without opening anyone's data.
      required:
        - source
        - reference_id
        - subject_kind
        - subject_id
        - label
        - state
        - occurred_at
        - attempt_count
        - last_error_code
        - resolved_at
      properties:
        source:
          $ref: '#/components/schemas/SupportOperationSourceKind'
        reference_id:
          $ref: '#/components/schemas/Uuid'
        subject_kind:
          type: [string, 'null']
          maxLength: 64
        subject_id:
          type: [string, 'null']
          format: uuid
        label:
          type: string
          maxLength: 120
        state:
          $ref: '#/components/schemas/SupportOperationState'
        occurred_at:
          type: string
          format: date-time
        attempt_count:
          type: integer
          minimum: 0
        last_error_code:
          type: [string, 'null']
          maxLength: 120
        resolved_at:
          type: [string, 'null']
          format: date-time
    SupportOperationPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SupportOperation'
        page:
          $ref: '#/components/schemas/Page'
    SupportDeliveryCircuit:
      type: object
      additionalProperties: false
      required:
        - event_type
        - state
        - window_started_at
        - success_count
        - failure_count
        - opened_until
      properties:
        event_type:
          type: string
          maxLength: 120
        state:
          type: string
          maxLength: 32
        window_started_at:
          type: string
          format: date-time
        success_count:
          type: integer
          minimum: 0
        failure_count:
          type: integer
          minimum: 0
        opened_until:
          type: [string, 'null']
          format: date-time
    SupportDeliveryCircuitList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SupportDeliveryCircuit'
    AttentionBillingNotice:
      type: object
      additionalProperties: false
      description: >-
        Failed charges and suspended subscriptions. Payments have no tables yet, so
        this says so instead of printing a zero.
      required: [availability]
      properties:
        availability:
          type: string
          enum: [not_modelled]
    AttentionVerificationNotice:
      type: object
      additionalProperties: false
      description: >-
        `withheld` when the operator does not hold `verify_professional_credentials`;
        every count is then null, never zero.
      required: [availability, pending_count, oldest_requested_at, renewals_due_count]
      properties:
        availability:
          type: string
          enum: [available, withheld]
        pending_count:
          type: [integer, 'null']
          minimum: 0
        oldest_requested_at:
          type: [string, 'null']
          format: date-time
        renewals_due_count:
          type: [integer, 'null']
          minimum: 0
    AttentionUnclaimedOrganizationNotice:
      type: object
      additionalProperties: false
      description: >-
        Organizations Allfit created that nobody claimed. `needs_follow_up_count` counts
        the ones whose latest ownership invitation lapsed, was declined or never existed.
        `withheld` without a duty that reads the organization directory.
      required: [availability, count, oldest_created_at, needs_follow_up_count]
      properties:
        availability:
          type: string
          enum: [available, withheld]
        count:
          type: [integer, 'null']
          minimum: 0
        oldest_created_at:
          type: [string, 'null']
          format: date-time
        needs_follow_up_count:
          type: [integer, 'null']
          minimum: 0
    AttentionFailureGroup:
      type: object
      additionalProperties: false
      description: >-
        One notification type or command operation that failed at least twice.
        `failures` counts failed delivery attempts or stranded commands; `affected`
        counts the notifications or commands involved.
      required: [source, label, affected, failures, latest_occurred_at, last_error_code]
      properties:
        source:
          $ref: '#/components/schemas/SupportOperationSourceKind'
        label:
          type: string
          maxLength: 120
        affected:
          type: integer
          minimum: 1
        failures:
          type: integer
          minimum: 2
        latest_occurred_at:
          type: string
          format: date-time
        last_error_code:
          type: [string, 'null']
          maxLength: 120
    AttentionOpenCircuit:
      type: object
      additionalProperties: false
      required: [event_type, state, failure_count, opened_until]
      properties:
        event_type:
          type: string
          maxLength: 120
        state:
          type: string
          enum: [open, half_open]
        failure_count:
          type: integer
          minimum: 0
        opened_until:
          type: [string, 'null']
          format: date-time
    AttentionFailureNotice:
      type: object
      additionalProperties: false
      description: >-
        System errors that repeat inside the window, and delivery channels that
        tripped. `withheld` without `diagnose_support_metadata`; the lists are then null.
      required: [availability, window_hours, groups, groups_truncated, open_circuits]
      properties:
        availability:
          type: string
          enum: [available, withheld]
        window_hours:
          type: integer
          enum: [24]
        groups:
          type: [array, 'null']
          maxItems: 20
          items:
            $ref: '#/components/schemas/AttentionFailureGroup'
        groups_truncated:
          type: [boolean, 'null']
        open_circuits:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/AttentionOpenCircuit'
    SupportAttentionPanel:
      type: object
      additionalProperties: false
      description: >-
        Counters only. No person, organization or aggregate identifier travels here,
        so a counter cannot be used to open anything.
      required:
        - generated_at
        - billing
        - credential_verifications
        - unclaimed_organizations
        - repeated_failures
      properties:
        generated_at:
          type: string
          format: date-time
        billing:
          $ref: '#/components/schemas/AttentionBillingNotice'
        credential_verifications:
          $ref: '#/components/schemas/AttentionVerificationNotice'
        unclaimed_organizations:
          $ref: '#/components/schemas/AttentionUnclaimedOrganizationNotice'
        repeated_failures:
          $ref: '#/components/schemas/AttentionFailureNotice'
    SupportBlockAvailability:
      type: string
      description: >-
        Whether a block of the projection can say anything. `unknown` is a
        statement about the person; `not_modelled` is a statement about the
        platform, and confusing the two makes the card lie by omission.
      enum: [available, unknown, not_modelled]
    SupportPersonMetadata:
      type: object
      additionalProperties: false
      description: >-
        The minimised operational state. No name, no full contact and no identity
        provider subject appear here, by construction rather than by filtering.
      required:
        - person_id
        - account_status
        - created_at
        - activated_at
        - contact_email_masked
        - contact_phone_masked
        - email_verified_at
        - phone_verified_at
        - has_access_account
        - access_account_linked_at
        - active_session_count
        - last_seen_at
        - has_professional_profile
        - membership_count
        - active_membership_count
        - relationships_availability
        - plan_availability
        - premium_availability
        - permissions_availability
      properties:
        person_id:
          $ref: '#/components/schemas/Uuid'
        account_status:
          type: string
          minLength: 1
          maxLength: 32
        created_at:
          type: string
          format: date-time
        activated_at:
          type: [string, 'null']
          format: date-time
        contact_email_masked:
          type: [string, 'null']
          maxLength: 254
        contact_phone_masked:
          type: [string, 'null']
          maxLength: 32
        email_verified_at:
          type: [string, 'null']
          format: date-time
        phone_verified_at:
          type: [string, 'null']
          format: date-time
        has_access_account:
          type: boolean
        access_account_linked_at:
          type: [string, 'null']
          format: date-time
        active_session_count:
          type: integer
          minimum: 0
        last_seen_at:
          type: [string, 'null']
          format: date-time
        has_professional_profile:
          type: boolean
        membership_count:
          type: integer
          minimum: 0
        active_membership_count:
          type: integer
          minimum: 0
        relationships_availability:
          $ref: '#/components/schemas/SupportBlockAvailability'
        plan_availability:
          $ref: '#/components/schemas/SupportBlockAvailability'
        premium_availability:
          $ref: '#/components/schemas/SupportBlockAvailability'
        permissions_availability:
          $ref: '#/components/schemas/SupportBlockAvailability'
    SupportPeopleSearch:
      type: object
      additionalProperties: false
      description: >-
        The outcome travels beside the items so a client cannot render an
        unexplained empty list. `HU-BO-006` criterion 3 is a contract obligation
        here, not a copy decision in one screen.
      required: [outcome, items]
      properties:
        outcome:
          type: string
          enum: [found, not_found]
        items:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/SupportPersonMetadata'
    PlatformRoleAssignmentPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlatformRoleAssignment'
        page:
          $ref: '#/components/schemas/Page'
    PlatformDutyAssignmentPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlatformDutyAssignment'
        page:
          $ref: '#/components/schemas/Page'
    CatalogDiscipline:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 120
    CatalogDisciplineList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogDiscipline'
    CatalogActivityType:
      type: object
      additionalProperties: false
      required: [id, discipline_code, code, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        discipline_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 120
    CatalogActivityTypeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogActivityType'
    ActivityTypeResultContract:
      type: object
      additionalProperties: false
      description: >-
        One effective association. The minimums travel so a client can explain a
        rejection locally; they never replace the server's validation.
      required:
        - result_contract_id
        - contract_code
        - version_number
        - activity_family
        - contract_schema_version
        - envelope
        - minimums
        - is_default
        - valid_from
      properties:
        result_contract_id:
          $ref: '#/components/schemas/UuidV7'
        contract_code:
          type: string
          pattern: '^[a-z][a-z0-9_.]{1,63}$'
        version_number:
          type: integer
          minimum: 1
        activity_family:
          $ref: '#/components/schemas/ActivityFamily'
        contract_schema_version:
          type: integer
          const: 1
        envelope:
          type: object
          additionalProperties: true
        minimums:
          type: object
          additionalProperties: true
        is_default:
          type: boolean
        valid_from:
          type: string
          format: date-time
    ActivityTypeResultContractList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityTypeResultContract'
    ActivityFamily:
      type: string
      enum: [strength, endurance, interval, mobility]
    ContractFixture:
      type: object
      additionalProperties: false
      required: [kind, payload, expected]
      description: >-
        One case the contract must accept or reject. A rule nobody demonstrated
        failing is a rule nobody tested, so both kinds are required to publish.
      properties:
        kind:
          type: string
          enum: [valid, invalid]
        payload:
          type: object
          additionalProperties: true
        expected:
          type: string
          minLength: 1
          maxLength: 200
    PublishedContractFixture:
      type: object
      additionalProperties: false
      required: [id, kind, payload_schema_version, payload, expected]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        kind:
          type: string
          enum: [valid, invalid]
        payload_schema_version:
          type: integer
          const: 1
        payload:
          type: object
          additionalProperties: true
        expected:
          type: string
          minLength: 1
          maxLength: 200
    ActivityTypeContractBinding:
      type: object
      additionalProperties: false
      required: [id, activity_type_id, is_default, valid_from, valid_to]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        activity_type_id:
          $ref: '#/components/schemas/Uuid'
        is_default:
          type: boolean
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: [string, 'null']
          format: date-time
    ResultContractPublication:
      type: object
      additionalProperties: false
      required: [contract_code, activity_family, envelope, minimums, fixtures, activity_type_id]
      properties:
        contract_code:
          type: string
          pattern: '^[a-z][a-z0-9_.]{1,63}$'
        activity_family:
          $ref: '#/components/schemas/ActivityFamily'
        envelope:
          type: object
          additionalProperties: true
        minimums:
          type: object
          additionalProperties: true
        fixtures:
          type: array
          minItems: 2
          maxItems: 100
          items:
            $ref: '#/components/schemas/ContractFixture'
        activity_type_id:
          $ref: '#/components/schemas/Uuid'
        is_default:
          type: boolean
          description: >-
            Defaults to true on the server. Publishing a new default closes the
            previous one with a window instead of overwriting it.
    ResultContract:
      type: object
      additionalProperties: false
      required:
        - id
        - contract_code
        - version_number
        - activity_family
        - contract_schema_version
        - envelope
        - minimums
        - status
        - published_at
        - fixtures
        - activity_type_bindings
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        contract_code:
          type: string
          pattern: '^[a-z][a-z0-9_.]{1,63}$'
        version_number:
          type: integer
          minimum: 1
        activity_family:
          $ref: '#/components/schemas/ActivityFamily'
        contract_schema_version:
          type: integer
          const: 1
        envelope:
          type: object
          additionalProperties: true
        minimums:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [published, deprecated]
        published_at:
          type: string
          format: date-time
        fixtures:
          type: array
          items:
            $ref: '#/components/schemas/PublishedContractFixture'
        activity_type_bindings:
          type: array
          items:
            $ref: '#/components/schemas/ActivityTypeContractBinding'
    PlatformDutyCode:
      type: string
      description: Closed duty catalogue fixed by ADR-028. Growing it is a documented decision.
      enum:
        - view_platform_metrics
        - diagnose_support_metadata
        - view_billing_metadata
        - manage_organization_lifecycle
        - request_break_glass
        - verify_professional_credentials
        - curate_global_catalog
        - manage_platform_commercial
        - manage_platform_access
        - audit_platform_access
        - approve_break_glass
        - audit_break_glass
        - manage_privacy_requests
    PlatformActorMode:
      type: string
      description: Derived from the duty code by the database; never accepted from a client.
      enum: [A10, A11, A12]
    PlatformAccessReasonCode:
      type: string
      minLength: 1
      maxLength: 120
      pattern: '^[A-Za-z0-9][A-Za-z0-9 ._:-]*$'
      description: Opaque operational reference. Never a name, a contact or free narrative.
    PlatformRoleGrant:
      type: object
      additionalProperties: false
