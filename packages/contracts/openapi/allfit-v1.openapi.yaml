          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: allfit_studio_session
      description: Opaque, host-only, HttpOnly Studio browser-session cookie.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: WorkOS AuthKit access token validated for the selected surface.
    backofficeAttemptAuth:
      type: apiKey
      in: cookie
      name: allfit_backoffice_auth_attempt
      description: Opaque, host-only, HttpOnly temporary Backoffice authentication attempt.
    backofficeCookieAuth:
      type: apiKey
      in: cookie
      name: allfit_backoffice_session
      description: Opaque, host-only, HttpOnly AAL2 Backoffice session.

  parameters:
    BreakGlassRequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    BreakGlassMine:
      name: mine
      in: query
      required: false
      description: Only your own requests. Absent means the whole tray.
      schema:
        type: boolean
    BreakGlassStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BreakGlassStatus'
    SupportOperationSource:
      name: source
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SupportOperationSourceKind'
    SupportOperationState:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SupportOperationState'
    AccessEventActor:
      name: actor_person_id
      in: query
      required: false
      description: The team member whose accesses are being reviewed.
      schema:
        $ref: '#/components/schemas/Uuid'
    AccessEventSubject:
      name: subject_person_id
      in: query
      required: false
      description: The person whose data was accessed.
      schema:
        $ref: '#/components/schemas/Uuid'
    AccessEventFrom:
      name: from
      in: query
      required: false
      description: Inclusive lower bound on when the access happened.
      schema:
        type: string
        format: date-time
    AccessEventTo:
      name: to
      in: query
      required: false
      description: Exclusive upper bound on when the access happened.
      schema:
        type: string
        format: date-time
    SupportAggregateId:
      name: aggregate_id
      in: query
      required: false
      description: >-
        The aggregate an event belongs to. Not every event is reachable from a
        person: a notification about an invitation belongs to the invitation.
      schema:
        $ref: '#/components/schemas/Uuid'
    SupportCaseReference:
      name: case_reference
      in: query
      required: true
      description: >-
        The case this read belongs to. A structured reference rather than free
        prose, so the record can be followed back to a case months later.
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9_-]{2,63}$'
    SupportPersonId:
      name: personId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SupportLookupIdentifier:
      name: identifier
      in: query
      required: false
      description: Exactly one lookup parameter is accepted per search.
      schema:
        $ref: '#/components/schemas/Uuid'
    SupportLookupEmail:
      name: email
      in: query
      required: false
      description: Exact match only. Exactly one lookup parameter is accepted per search.
      schema:
        type: string
        format: email
        maxLength: 254
    SupportLookupPhone:
      name: phone
      in: query
      required: false
      description: Exact match only. Exactly one lookup parameter is accepted per search.
      schema:
        type: string
        pattern: '^\+[1-9][0-9]{6,14}$'
    OnboardingAttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    VersionNumber:
      name: versionNumber
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PlannedSessionId:
      name: plannedSessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MealId:
      name: mealId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GoalVersionId:
      name: goalVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CatalogActivityTypeId:
      name: activityTypeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ResultContractId:
      name: contractId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    PlatformPersonFilter:
      name: person_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
    PlatformDutyFilter:
      name: duty_code
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PlatformDutyCode'
    PlatformDutyStatusFilter:
      name: status
      in: query
      required: false
      description: Filters on the effective state, so `expired` reflects the clock, not a job.
      schema:
        type: string
        enum: [scheduled, active, suspended, expired, revoked]
    PlatformAssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UuidV7'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUIDv4 reused only for HTTP retries of this operation.
      schema:
        $ref: '#/components/schemas/UuidV4'
    CommandId:
      name: Command-Id
      in: header
      required: true
      description: UUIDv7 durable identity generated when the user intention is created.
      schema:
        $ref: '#/components/schemas/UuidV7'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag for the execution revision used as the command base.
      schema:
        type: string
        pattern: '^"execution:[0-9a-f-]{36}:r[0-9]+"$'
    PlanningDraftIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong content ETag returned with the current editable draft.
      schema:
        type: string
        pattern: '^"sha256:[A-Za-z0-9_-]{43}"$'
    OrganizationIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag for the organization revision used as the command base.
      schema:
        type: string
        pattern: '^"organization:[0-9a-f-]{36}:r[0-9]+"$'
    OrganizationSiteIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag for the organization site revision used as the command base.
      schema:
        type: string
        pattern: '^"organization-site:[0-9a-f-]{36}:r[0-9]+"$'
    NutritionMealIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag for the nutrition meal revision used as the command base.
      schema:
        type: string
        pattern: '^"nutrition-meal:[0-9a-f-]{36}:r[0-9]+"$'
    HistoricalAccessCase:
      name: X-Historical-Access-Case
      in: header
      required: false
      description: Opaque case UUID. When present the endpoint uses only the frozen guidance projection.
      schema:
        $ref: '#/components/schemas/Uuid'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 160
    FromDate:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      required: true
      description: Inclusive date; range from..to must not exceed 31 days.
      schema:
        type: string
        format: date
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 1024

  headers:
    NoStore:
      required: true
      schema:
        type: string
        const: no-store
    PrivateNoStore:
      required: true
      schema:
        type: string
        const: private, no-store
    PrivateRevalidate:
      required: true
      schema:
        type: string
        const: private, max-age=0, must-revalidate
    ETag:
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 160
    Location:
      required: true
      schema:
        type: string
        format: uri-reference
    IdempotentReplay:
      required: false
      description: Present and true only when the minimal outcome is replayed.
      schema:
        type: string
        const: 'true'
    RetryAfter:
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 30
    SetCookie:
      required: true
      description: Sets or clears an HttpOnly browser cookie; its value is always opaque.
      schema:
        type: string

  responses:
    BadRequest:
      description: Missing/invalid headers or malformed request
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/idempotency-key-required
            title: Idempotency-Key is required
            status: 400
            request_id: 01JEXAMPLE0000000000000000
    UnsupportedMediaType:
      description: >-
        A command that declares a request body received a representation other
        than application/json, or a command that declares none received a payload
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/unsupported-media-type
            title: Content-Type must be application/json
            status: 415
            request_id: 01JEXAMPLE0000000000000000
    Unauthenticated:
      description: Missing, invalid or expired token
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/unauthenticated
            title: Authentication is required
            status: 401
            request_id: 01JEXAMPLE0000000000000000
    Forbidden:
      description: Authenticated actor cannot execute the operation
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/forbidden
            title: The actor cannot execute this operation
            status: 403
            request_id: 01JEXAMPLE0000000000000000
    AccountClosed:
      description: The person linked to the authenticated account is closed
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/account-closed
            title: The account is closed
            status: 403
            request_id: 01JEXAMPLE0000000000000000
    RegistrationIncomplete:
      description: The authenticated Studio account has not completed registration
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/registration-incomplete
            title: Registration must be completed first
            status: 403
            request_id: 01JEXAMPLE0000000000000000
    TooManyRequests:
      description: >-
        Rate limit exceeded. Mandatory on the authentication surface: without it a
        six-digit verification code is brute-forceable, and repeated registration
        attempts become a way to enumerate addresses by timing.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpstreamUnavailable:
      description: An authentication dependency is temporarily unavailable
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/upstream-unavailable
            title: Authentication is temporarily unavailable
            status: 503
            request_id: 01JEXAMPLE0000000000000000
    RateLimited:
      description: A closed abuse-prevention limit rejected the request
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/rate-limited
            title: Too many invitation attempts
            status: 429
            request_id: 01JEXAMPLE0000000000000000
    ScopeRequired:
      description: Required live grant is not effective
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/scope-required
            title: Required consent is not effective
            status: 403
            request_id: 01JEXAMPLE0000000000000000
            required_scope:
              code: relationship_training
              level: read
    NotFound:
      description: Resource absent or not visible to the actor
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/not-found
            title: Resource not found
            status: 404
            request_id: 01JEXAMPLE0000000000000000
    Conflict:
      description: Concurrent conflict or idempotency identity reuse
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/idempotency-in-progress
            title: The command is still in progress
            status: 409
            request_id: 01JEXAMPLE0000000000000000
    OrganizationCommandConflict:
      description: Stale revision, idempotency conflict, or a bounded command lock timeout
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StaleDraft:
      description: If-Match refers to a stale execution revision
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/stale-draft
            title: The local draft is stale
            status: 409
            request_id: 01JEXAMPLE0000000000000000
    PreconditionRequired:
      description: If-Match is required
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/precondition-required
            title: If-Match is required
            status: 428
            request_id: 01JEXAMPLE0000000000000000
    ValidationFailed:
      description: Request violates its closed schema or business validation
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/validation-failed
            title: The request does not satisfy the contract
            status: 422
            request_id: 01JEXAMPLE0000000000000000
            errors:
              - code: required
                path: /started_at
                message: started_at is required.
    ContractValidationFailed:
      description: Execution results do not satisfy the frozen result contract
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/contract-validation-failed
            title: The execution does not satisfy its frozen result contract
            status: 422
            request_id: 01JEXAMPLE0000000000000000
            errors:
              - code: required
                path: /strength_sets/0/achieved_reps
                message: The detailed contract requires achieved repetitions.
    CommandEffectDisposed:
      description: The command already ran but its effect was disposed
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/command-effect-disposed
            title: The command effect was disposed
            status: 410
            request_id: 01JEXAMPLE0000000000000000

  schemas:
    ScopeResourceRule:
      type: object
      additionalProperties: false
      description: >-
        One resource and field the version speaks about. An exclusion is stated
        rather than left out, because criterion 1 asks what a permission excludes
        and an absence cannot answer that.
      required: [resource, field, data_classification_code, max_action]
      properties:
        resource:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
        field:
          type: string
          description: A field name, or `*` for every field of the resource.
          maxLength: 64
        data_classification_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
        max_action:
          $ref: '#/components/schemas/AccessLevel'
        is_excluded:
          type: boolean
          default: false
        historical_readable:
          type: boolean
          default: false
          description: >-
            Whether the field may be read for periods before the grant existed.
            Only valid on an included, read-only field.
    ScopeDefinition:
      type: object
      additionalProperties: false
      required: [id, scope_code, version_number, status, published_at, rules]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        scope_code:
          $ref: '#/components/schemas/ScopeCode'
        version_number:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/PublicationStatus'
        published_at:
          type: [string, 'null']
          format: date-time
        rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ScopeResourceRule'
    ScopeDefinitionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScopeDefinition'
    ScopeDefinitionPublication:
      type: object
      additionalProperties: false
      description: >-
        No version number: the server assigns the next one. At least one rule must
        be included, because a version made only of exclusions grants nothing.
      required: [scope_code, rules]
      properties:
        scope_code:
          $ref: '#/components/schemas/ScopeCode'
        rules:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/ScopeResourceRule'
    BreakGlassCategory:
      type: string
      description: >-
        The approvable categories. Everything else — media, identity, contact,
        secrets, payments, raw sensor data — is not a category with a higher bar:
        it can never be approved.
      enum:
        - relationship_training
        - prior_training_history
        - nutrition_guidance
        - body_progress
        - health_context
        - nutrition_intake
    BreakGlassPurpose:
      type: string
      description: >-
        Five closed purposes. There is deliberately no `other`: marketing,
        commercial recovery, AI training and operational curiosity are not
        purposes, and an open field would become all four.
      enum:
        - service_dispute
        - legal_or_regulatory_obligation
        - customer_support_request
        - security_investigation
        - authorized_quality_review
    BreakGlassTier:
      type: string
      description: Derived from the categories by the server, never sent by a client.
      enum: [standard, restricted]
    BreakGlassStatus:
      type: string
      enum: [requested, approved, rejected, closed, expired]
    CredentialVerificationMethod:
      type: string
      description: >-
        How a credential was checked. Documents, civil identity, health and a
        complete profile are never verifiable in V1, so no method exists for them.
      enum: [official_registry_lookup, issuer_confirmation]
    CredentialVerificationResult:
      type: string
      description: >-
        What a verifier may record. There is no default, and `unverifiable` is the
        answer whenever the evidence does not reach.
      enum: [verified, rejected, unverifiable]
    CredentialVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - request_id
        - kind
        - requested_at
        - credential_id
        - credential_type_code
        - credential_type_name
        - issuer
        - credential_name
        - credential_identifier
        - issued_on
        - expires_on
        - verification_url
        - holder_person_id
        - holder_given_name
        - holder_family_name
        - suggested_method
        - previous_result
        - previous_valid_to
        - viewer_can_decide
      properties:
        request_id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum: [initial, renewal]
        requested_at:
          type: string
          format: date-time
        credential_id:
          $ref: '#/components/schemas/Uuid'
        credential_type_code:
          type: string
        credential_type_name:
          type: string
        issuer:
          type: string
        credential_name:
          type: string
        credential_identifier:
          type: [string, 'null']
        issued_on:
          type: [string, 'null']
          format: date
        expires_on:
          type: [string, 'null']
          format: date
        verification_url:
          type: [string, 'null']
          format: uri
        holder_person_id:
          $ref: '#/components/schemas/Uuid'
        holder_given_name:
          type: string
        holder_family_name:
          type: string
        suggested_method:
          $ref: '#/components/schemas/CredentialVerificationMethod'
        previous_result:
          type: [string, 'null']
          description: The latest result recorded for this exact version, so a renewal shows what it renews.
        previous_valid_to:
          type: [string, 'null']
          format: date-time
        viewer_can_decide:
          type: boolean
          description: >-
            A hint for the screen, never authority. False when the caller is the
            holder or shares an active organization with them.
    CredentialVerificationRequestList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialVerificationRequest'
    CredentialVerificationDecisionCreate:
      type: object
      additionalProperties: false
      description: >-
        No policy, no validity and no evidence fingerprint: the server derives all
        three, so a client cannot decide how long its own verification lasts.
      required:
        - request_id
        - result
        - method
        - source_authority
        - source_jurisdiction
        - source_reference
        - source_status
        - source_checked_at
      properties:
        request_id:
          $ref: '#/components/schemas/Uuid'
        result:
