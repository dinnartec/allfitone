        their height, and if the second call fails the first stays saved.


        The body carries **what the person chose**, not the canonical value. The
        server converts with the factor in the unit catalogue, and stores both — the
        canonical figure and what she read. Converting in the client would put the
        factor in two places, and keeping only what was displayed makes 74 kg → 163 lb
