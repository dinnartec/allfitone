          type: boolean
    MobilityResultReplace:
      type: object
      additionalProperties: false
      required: [sequence_position]
      description: At least one of the two measures, because a held nothing is not a result.
      properties:
        sequence_position:
          type: integer
          minimum: 1
        movement_id:
          $ref: '#/components/schemas/UuidV7'
        side:
          type: string
          enum: [left, right, bilateral, not_applicable]
        hold_duration_seconds:
          type: number
          exclusiveMinimum: 0
        completed_repetitions:
          type: integer
          minimum: 1
    ExecutionResultsReplace:
      type: object
      additionalProperties: false
      required: [strength_sets]
      description: >-
        The working state, whole. `OP-EXE-005` is a replace and not a patch: somebody
        editing the set they logged four sets ago sends the session as it now stands,
        so there is never a half-applied session and never a merge to reason about.


        The four families each have their own array. `strength_sets` is required and
        may be empty — a running session records no sets and must still be able to say
        so — while the other three are omitted when the session has none of them.


        `segments` is optional, and Space omits it. The session's activity type is
        frozen onto the execution when the attempt starts, from the template it came
        from; a client restating it could only contradict what was already frozen.
      example:
        segments:
          - position: 1
            activity_type_code: strength_training
        strength_sets:
          - segment_position: 1
            order: 1
            movement_id: 018f6f8d-2b00-7a00-8000-000000000601
            planned_step_id: 018f6f8d-2b00-7a00-8000-000000000701
            achieved_reps: 8
            load:
              value: 80
              unit: kg
            rpe: 8
      properties:
        segments:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ExecutionSegment'
        endurance_laps:
          type: array
          items:
            $ref: '#/components/schemas/EnduranceLapReplace'
        interval_results:
          type: array
          items:
            $ref: '#/components/schemas/IntervalResultReplace'
        mobility_results:
          type: array
          items:
            $ref: '#/components/schemas/MobilityResultReplace'
        strength_sets:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/StrengthSet'
    ExecutionSegment:
      type: object
      additionalProperties: false
      required: [position, activity_type_code]
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 100
        activity_type_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
    StrengthSet:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        segment_position:
          type: integer
          minimum: 1
          maximum: 100
          description: >-
            Which segment the set belongs to. Omitted when the session declares none,
            which is every Space session today: a position pointing at a segment that
            was never sent would name something that does not exist.
        order:
          type: integer
          minimum: 1
          maximum: 1000
        movement_id:
          type: [string, 'null']
          format: uuid
        planned_step_id:
          type: [string, 'null']
          format: uuid
        achieved_reps:
          type: [integer, 'null']
          minimum: 1
        load:
          oneOf:
            - $ref: '#/components/schemas/Load'
            - type: 'null'
        rpe:
          type: [number, 'null']
          minimum: 0
          maximum: 10
    Load:
      type: object
      additionalProperties: false
      required: [value, unit]
      properties:
        value:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [kg, lb]
    ExecutionResultsState:
      type: object
      additionalProperties: false
      required: [id, status, revision_number, segment_count, result_count]
      example:
        id: 0190a0b1-2c3d-7e4f-8a9b-0c1d2e3f4a5b
        status: in_progress
        revision_number: 1
        segment_count: 1
        result_count: 1
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [in_progress, paused]
        revision_number:
          type: integer
          minimum: 1
        segment_count:
          type: integer
          minimum: 0
          description: >-
            Zero while a session declares no segmentation, which is every Space
            session today. It is a count of what is stored, not of what was sent.
        result_count:
          type: integer
          minimum: 0
          description: Zero on a session somebody has opened and not yet recorded into.

    ExecutionFinalize:
      type: object
      additionalProperties: false
      required: [ended_at]
      example:
        ended_at: '2026-07-27T07:05:00-05:00'
      properties:
        ended_at:
          type: string
          format: date-time
    ExecutionAbandoned:
      type: object
      additionalProperties: false
      required: [id, status, revision_number, result_count]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        status:
          type: string
          const: abandoned
        revision_number:
          type: integer
          minimum: 1
        result_count:
          type: integer
          minimum: 0
          description: >-
            What the attempt keeps. Abandoning does not delete training that happened;
            it says the session was not finished.
    ExecutionFinalized:
      type: object
      additionalProperties: false
      required:
        [id, status, validation_status, revision_number, achieved_level, is_primary, contract]
      example:
        id: 0190a0b1-2c3d-7e4f-8a9b-0c1d2e3f4a5b
        status: completed
        validation_status: valid
        revision_number: 2
        achieved_level: detailed
        is_primary: true
        contract:
          id: 018f6f8d-2b00-7a00-8000-000000000801
          version: 1
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          const: completed
        validation_status:
          type: string
          const: valid
        revision_number:
          type: integer
          minimum: 1
        achieved_level:
