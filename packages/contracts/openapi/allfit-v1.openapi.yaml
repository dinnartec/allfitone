openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Allfit V1 vertical slice API
  version: 1.0.0
  description: >-
    Canonical contract for the first implementable vertical slice shared by
    Allfit Studio and Allfit Space. Every operation maps to exactly one OP-* entry.
    Stable product endpoints outside this file remain non-implementable until
    added through the contract-first gate. Operational and provisional routes
    are not client contracts and must be declared in the auditable exclusion list.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
tags:
  - name: Studio Identity
    description: Hosted authentication and opaque browser sessions for Allfit Studio.
  - name: Space Identity
    description: >-
      Headless account creation and authentication for Allfit Space. The app owns
      its screens and never calls the identity provider: it posts credentials
      here and the API makes the provider call with the server API key.
  - name: Studio Planning
    description: Planning commands and queries performed from Allfit Studio.
  - name: Space Agenda
    description: Personal agenda queries exposed to Allfit Space.
  - name: Space Execution
    description: Workout execution commands performed from Allfit Space.
  - name: Studio Execution
    description: Authorized workout execution queries exposed to Allfit Studio.
  - name: Space Privacy
    description: Consent and privacy commands controlled by the person.
  - name: Space Nutrition
    description: Personal nutrition capture and goal operations.
  - name: Studio Nutrition
    description: Authorized professional nutrition operations.
x-allfit-contract-gate:
  source: V1_OPERATIONS_MATRIX.md
  rule: >-
    Every implemented route must either have an OpenAPI operation with
    x-allfit-operation or appear in exclusions. Exclusions are not stable client
    contracts and must correspond to an implemented route.
  exclusions:
    - method: GET
      path: /health
      classification: operational
      owner: platform
      lifecycle: permanent
      reason: Liveness belongs to deployment operations, not the product API.
x-allfit-error-catalog:
  - code: registration-incomplete
    status: 403
    description: The authenticated account has not completed domain registration.
  - code: account-closed
    status: 403
    description: The person linked to the authenticated account is closed.
x-allfit-media-url-policy:
  space_owner:
    delivery: signed_storage_url
    scheme: HTTPS
    ttl_seconds: 300
    allowed_method: GET
    cache_control: private, no-store
    query_is_opaque: true
    logging: Never log or persist the query string.
  studio_professional:
    delivery: authenticated_api_proxy
    allowed_method: GET
    cache_control: private, no-store
    authorization_rechecked_per_request: true
    redirect_to_storage: false
    failure_without_effective_access: 404

paths:
  /space/v1/auth/registrations:
    post:
      tags: [Space Identity]
      operationId: startSpaceRegistration
      x-allfit-operation: OP-IDN-029
      x-allfit-cache: no-store
      summary: Create an account and send an email verification code
      description: >-
        Creates the credential and nothing else. No person, no Fitness ID, no row
        in our database: HU-SP-001 criterion 4 makes activation a later step, and
        HU-SP-007 forbids storing anything fitness-related before adult
        eligibility is established.


        **The response never reveals whether the email already has an account.**
        Success and "already registered" are indistinguishable — same status, same
        body shape, same expiry. The provider distinguishes them and the
        adapter normalizes that away, because propagating it would turn this
        endpoint into an oracle for which addresses are registered. That is
        HU-SP-001 criterion 3, and it is the reason there is no 409 here.


        Nothing is stored on our side, so there is no handle to return and no
        state to expire. Verification identifies the attempt by the address the
        client already holds.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceRegistrationCreate'
      responses:
        '202':
          description: >-
            Accepted. If the address can receive an account, a verification code
            has been sent. Deliberately not 201: the client is told nothing about
            whether a resource was created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceRegistrationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /space/v1/auth/registrations/verification:
    post:
      tags: [Space Identity]
      operationId: verifySpaceRegistration
      x-allfit-operation: OP-IDN-030
      x-allfit-cache: no-store
      summary: Verify the email code and issue the first session
      description: >-
        Confirms the person controls the address, then returns tokens so they are
        not asked for the password they typed moments ago. The assurance is the
        same one a password reset relies on: possession of the mailbox.


        Still creates nothing in our database. The `ACCESS_ACCOUNT` is derived on
        the first authenticated Space operation, which is `OP-IDN-001`.


        Identified by the credentials the client already holds rather than by a
        server-issued handle, so the endpoint keeps no state and nothing expires
        out from under it. The provider drives verification through a sign-in
        attempt against an unverified account, which is why the password is sent
        alongside the code.


        The response is identical whether the code is wrong, the password wrong,
        the address unknown, or the account already verified.


        Rate limiting is mandatory here: a six-digit code is brute-forceable in
        minutes otherwise.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceRegistrationVerify'
      responses:
        '200':
          description: Email verified and the first session issued
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceSessionTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            The code is wrong or expired, the address has no pending
            registration, or it was already verified. One answer for all of
            them, so the endpoint cannot be used to probe.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /studio/v1/auth/start:
    get:
      tags: [Studio Identity]
      operationId: startStudioAuthentication
      x-allfit-operation: OP-IDN-025
      x-allfit-cache: no-store
      summary: Start the hosted Studio authentication flow
      security: []
      responses:
        '302':
          description: Redirect to the WorkOS hosted authentication flow
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /studio/v1/auth/callback:
    get:
      tags: [Studio Identity]
      operationId: completeStudioAuthentication
      x-allfit-operation: OP-IDN-026
      x-allfit-cache: no-store
      summary: Complete authentication and create an opaque Studio session
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '303':
          description: Session created; redirect to Studio without credentials in the URL
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /studio/v1/session:
    get:
      tags: [Studio Identity]
      operationId: getStudioSession
      x-allfit-operation: OP-IDN-027
      x-allfit-cache: private-no-store
      summary: Get the current Studio session registration status
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current authenticated Studio session
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountClosed'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /studio/v1/auth/logout:
    post:
      tags: [Studio Identity]
      operationId: logoutStudioSession
      x-allfit-operation: OP-IDN-028
      x-allfit-cache: no-store
      summary: Revoke the current session and start hosted WorkOS logout
      security:
        - cookieAuth: []
        - {}
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
      responses:
        '303':
          description: Local session revoked; redirect to hosted logout and back to Studio
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /studio/v1/organizations/{organizationId}/programs/{programId}/versions:
    post:
      tags: [Studio Planning]
      operationId: publishProgramVersion
      x-allfit-operation: OP-PLN-008
      x-allfit-cache: no-store
      summary: Publish an immutable program version
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/ProgramId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramVersionCreate'
      responses:
        '201':
          description: Published version
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /studio/v1/organizations/{organizationId}/relationships/{relationshipId}/assignments:
    post:
      tags: [Studio Planning]
      operationId: assignProgramVersion
      x-allfit-operation: OP-PLN-010
      x-allfit-cache: no-store
      summary: Assign an immutable program version through an active relationship
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/RelationshipId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramAssignmentCreate'
      responses:
        '201':
          description: Assignment and schedule materialized atomically
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /space/v1/agenda:
    get:
      tags: [Space Agenda]
      operationId: listMyAgenda
      x-allfit-operation: OP-PLN-016
      x-allfit-cache: private, max-age=0, must-revalidate
      summary: List the authenticated person's agenda
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Agenda page
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaPage'
        '304':
          description: The agenda representation has not changed
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /space/v1/planned-sessions/{plannedSessionId}/attempts:
    post:
      tags: [Space Execution]
      operationId: startPlannedSessionAttempt
      x-allfit-operation: OP-EXE-001
      x-allfit-cache: no-store
      x-allfit-command-resource-id: true
      summary: Start an attempt using Command-Id as executed_session.id
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlannedSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptCreate'
      responses:
        '201':
          description: Attempt started
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /space/v1/executions/{executionId}/results:
    put:
      tags: [Space Execution]
      operationId: replaceExecutionResults
      x-allfit-operation: OP-EXE-005
      x-allfit-cache: no-store
      summary: Replace working results under optimistic concurrency
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionResultsReplace'
      responses:
        '200':
          description: Results replaced and revision incremented
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResultsState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaleDraft'
        '422':
          $ref: '#/components/responses/ContractValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /space/v1/executions/{executionId}/finalize:
    post:
      tags: [Space Execution]
      operationId: finalizeExecution
      x-allfit-operation: OP-EXE-006
      x-allfit-cache: no-store
      summary: Validate and finalize an execution atomically
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionFinalize'
      responses:
        '200':
          description: Execution finalized
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionFinalized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ContractValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /studio/v1/organizations/{organizationId}/clients/{personId}/executions/{executionId}:
    get:
      tags: [Studio Execution]
      operationId: getAuthorizedClientExecution
      x-allfit-operation: OP-EXE-018
      x-allfit-cache: private, no-store
      summary: Read one execution through the authorized live projection
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Authorized and field-redacted execution
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedExecution'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ScopeRequired'
        '404':
          $ref: '#/components/responses/NotFound'

  /space/v1/consents/{grantId}/revocation:
    post:
      tags: [Space Privacy]
      operationId: revokeConsentGrant
      x-allfit-operation: OP-PRV-005
      x-allfit-cache: no-store
      summary: Revoke a live or frozen grant and invalidate projections atomically
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GrantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          description: Grant revoked
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRevocation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/CommandEffectDisposed'

  /space/v1/nutrition/meals:
    post:
      tags: [Space Nutrition]
      operationId: createNutritionMeal
      x-allfit-operation: OP-NUT-001
      x-allfit-cache: no-store
      x-allfit-command-resource-id: true
      summary: Record one structured meal using Command-Id as its durable identity
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NutritionMealCreate'
      responses:
        '201':
          description: Meal recorded
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionMeal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    get:
      tags: [Space Nutrition]
      operationId: listMyNutritionMeals
      x-allfit-operation: OP-NUT-002
      x-allfit-cache: private, no-store
      summary: List meals owned by the authenticated person
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Authorized personal meal page
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionMealPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /space/v1/nutrition/meals/{mealId}:
    patch:
      tags: [Space Nutrition]
      operationId: updateNutritionMeal
      x-allfit-operation: OP-NUT-003
      x-allfit-cache: no-store
      summary: Revise meal structure or attach a sanitized photo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MealId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/NutritionMealIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NutritionMealPatch'
      responses:
        '200':
          description: Meal revised atomically
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionMeal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaleDraft'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [Space Nutrition]
      operationId: deleteNutritionMeal
      x-allfit-operation: OP-NUT-004
      x-allfit-cache: no-store
      summary: Delete one personal meal through governed disposition
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MealId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      responses:
        '204':
          description: Meal disposed
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
