        person_id:
          $ref: '#/components/schemas/Uuid'
        platform_role:
          type: string
          enum: [allfit_admin]
    PlatformRoleAssignment:
      type: object
      additionalProperties: false
      required:
        - id
        - person_id
        - platform_role
        - status
        - granted_by_person_id
        - granted_at
        - revoked_by_person_id
        - revoked_at
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        person_id:
          $ref: '#/components/schemas/Uuid'
        platform_role:
          type: string
          enum: [allfit_admin]
        status:
          type: string
          enum: [active, revoked]
        granted_by_person_id:
          $ref: '#/components/schemas/Uuid'
        granted_at:
          type: string
