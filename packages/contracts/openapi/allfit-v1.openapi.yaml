      responses:
        '201':
          description: The resolved request and the verification that resolved it
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialVerificationOutcome'
