      operationId: abandonExecution
      x-allfit-operation: OP-EXE-003
      x-allfit-cache: no-store
      summary: Close an attempt as abandoned, keeping what it recorded
      description: >-
        Leaving a session is not the same as never having trained. The attempt closes
        as abandoned and stays in the history with whatever it reached; it is never the
        primary attempt for its day and does not count towards adherence, and the day
        itself goes back to being scheduled.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
