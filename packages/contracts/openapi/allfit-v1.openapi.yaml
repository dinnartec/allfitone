            $ref: '#/components/schemas/ProfessionalCatalogItem'
    ProfessionalCredentialTypeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProfessionalCatalogItem'
    ProfessionalProfilePut:
