      description: >-
        **Without this a programme draft cannot be resumed at all.** `OP-PLN-022` lists the programmes a person follows and it starts from assignments, so one that was never published has no version and no assignment and appears in no query — it exists, it counts, and nobody can get back to it. The same hole `OP-PLN-023` closed for routines, except that a routine at least appeared in the person's own list and a programme appears nowhere. Answers the most recently touched one, or nothing.
