  /space/v1/programs/{programId}/discard:
    post:
      tags: [Space Planning]
      operationId: discardMyProgram
      x-allfit-operation: OP-PLN-029
      x-allfit-cache: no-store
      summary: Discard a programme I never published
      description: >-
        The twin of `OP-PLN-028` and for the same reasons. Leaving a named programme asks whether to keep it as a draft or throw it away, and this is the throwing away. **It is a state, not a deletion:** `allfit_api` has no `DELETE` on this resource. A programme with a published version is refused, because assignments reference that version and sessions have been materialised against it. Without this, a programme somebody starts and abandons is orphaned — it exists, it counts, and nobody can reach it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProgramId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          description: The programme, now archived and without its draft
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /space/v1/programs/{programId}/remove:
    post:
      tags: [Space Planning]
      operationId: removeMyProgram
      x-allfit-operation: OP-PLN-034
      x-allfit-cache: no-store
      summary: Remove a programme I have been training
      description: >-
        What `OP-PLN-029` deliberately cannot do. A discard only knows how to throw
        away a programme that was never published, and the list somebody removes from
        shows nothing but published ones — so what the list offers is precisely what
        the discard refuses. This is the operation for a programme that has already
        been trained.


        **It is a state, not a deletion, and what was trained is kept.** `allfit_api`
        has no `DELETE` on this resource and will not get one. The published versions
        are deprecated rather than erased, because sessions were materialised against
        them and `ADR-009` freezes what a version said; the person's agenda on the
        programme ends and its unfulfilled sessions go with it, while every session
        already completed or executed stays exactly where it is. Removing a programme
        takes it out of the week ahead, never out of the past.


        **`with_routines` is the caller's answer because only they know what those
        routines are for.** When it is true, only the routines no other programme of
        theirs still uses are archived: a routine a second programme holds stays,
        because taking it would leave that programme without a session it needs, and
        `OP-PLN-028` already refuses to leave a programme empty. Asking rather than
        assuming is what lets the confirmation name what is about to go.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProgramId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceProgramRemoval'
      responses:
        '200':
          description: The programme, now archived, with its published versions deprecated
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /space/v1/programs/{programId}/duplicate:
    post:
      tags: [Space Planning]
      operationId: duplicateMyProgram
      x-allfit-operation: OP-PLN-035
      x-allfit-cache: no-store
      summary: Start a programme of my own from one I already have
      description: >-
        A copy is how somebody keeps what a programme taught them while changing it.
        It answers the **new** programme, never the original, which is left untouched.


        **The copy is a draft and nothing else.** No version is minted and no
        assignment is created, because a copy nobody has looked at yet is not a plan
        anybody is following: publishing it is the editor's tick and throwing it away
        is the editor's cross, exactly as for a programme written from nothing. Its
        content is the original's latest published version — or its draft, when it was
        never published — and it carries the original's name with a copy suffix so the
        two are told apart in a list at a glance.


        **The routines are not copied.** The copy's sessions point at the same
        immutable routine versions the original pointed at, so renaming a programme
        does not silently double the person's library. Editing the copy's own sessions
        afterwards is the ordinary editor, and changes nothing the original says.


        It is also the only way out of a dead end: a programme taken from Allfit has
        no draft and cannot be edited at all, and duplicating it gives the person a
        version of it that is theirs to change.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProgramId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          description: The new programme and its draft, never the one it was copied from
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

