      enum: [live, frozen, break_glass, organization_operational, support_metadata]
    AccessEvent:
      type: object
      additionalProperties: false
      description: >-
        The record of one access. It never carries what was read: the table it
        comes from has no content columns, and the closed query returns this exact
        shape.
      required:
        - actor_person_id
        - subject_person_id
        - resource
        - resource_id
        - purpose
        - result
        - scope_code
        - scope_version
        - access_mode
        - occurred_at
      properties:
        actor_person_id:
          $ref: '#/components/schemas/Uuid'
        subject_person_id:
          type: [string, 'null']
          format: uuid
        resource:
          type: string
          description: The kind of data that was read, such as `nutrition.intake_entries`.
        resource_id:
          type: [string, 'null']
          format: uuid
        purpose:
          type: string
        result:
          type: string
          enum: [allowed, denied]
        scope_code:
          type: [string, 'null']
        scope_version:
          type: [integer, 'null']
        access_mode:
          $ref: '#/components/schemas/AccessMode'
        occurred_at:
          type: string
          format: date-time
    AccessEventPage:
      type: object
      additionalProperties: false
      required: [items, withheld_from_you]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessEvent'
        withheld_from_you:
          type: integer
          minimum: 0
          description: >-
            How many records matching these filters were removed because this
            auditor requested or approved the break-glass window they belong to.
            Reported separately from the list so that it survives an empty one.
    BreakGlassApproval:
      type: object
      additionalProperties: false
      required: [approver_person_id, decision, reason_code, decided_at]
      properties:
        approver_person_id:
          $ref: '#/components/schemas/Uuid'
        decision:
          type: string
          enum: [approved, rejected]
        reason_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{2,63}$'
        decided_at:
          type: string
          format: date-time
    BreakGlassRequest:
      type: object
      additionalProperties: false
      description: >-
        The file. It carries metadata about purpose and subject, and never the
        person's content.
      required:
        - id
        - requester_person_id
        - subject_person_id
        - categories
        - purpose
        - case_reference
        - sensitivity_tier
        - required_approvals
        - requested_duration_minutes
        - requested_at
        - request_expires_at
        - status
        - window_starts_at
        - window_ends_at
        - closed_at
        - reviewed_at
        - review_outcome
        - approvals
        - exercise_count
        - viewer_is_requester
        - viewer_can_decide
        - viewer_can_exercise
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        requester_person_id:
          $ref: '#/components/schemas/Uuid'
        subject_person_id:
          $ref: '#/components/schemas/Uuid'
        categories:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BreakGlassCategory'
        purpose:
          $ref: '#/components/schemas/BreakGlassPurpose'
        case_reference:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{2,63}$'
        sensitivity_tier:
          $ref: '#/components/schemas/BreakGlassTier'
        required_approvals:
          type: integer
          minimum: 1
          maximum: 2
        requested_duration_minutes:
          type: integer
          minimum: 1
          maximum: 30
        requested_at:
          type: string
          format: date-time
        request_expires_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BreakGlassStatus'
        window_starts_at:
          type: [string, 'null']
          format: date-time
        window_ends_at:
          type: [string, 'null']
          format: date-time
        closed_at:
          type: [string, 'null']
          format: date-time
        reviewed_at:
          type: [string, 'null']
          format: date-time
        review_outcome:
          type: [string, 'null']
          enum: [justified, unjustified, incident_opened, null]
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/BreakGlassApproval'
        exercise_count:
          type: integer
          minimum: 0
        viewer_is_requester:
          type: boolean
          description: >-
            Whether the caller opened this file. The Backoffice session carries no
            domain identifier, so the server answers this rather than the client
            re-deriving it from one.
        viewer_can_decide:
          type: boolean
          description: >-
            A hint for the screen, never authority: it saves offering a button that
            would always be refused. Every command revalidates on its own.
        viewer_can_exercise:
          type: boolean
          description: A hint for the screen, on the same terms as `viewer_can_decide`.
    BreakGlassRequestList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BreakGlassRequest'
    BreakGlassRequestCreate:
      type: object
      additionalProperties: false
      description: >-
        No tier, no approval count and no duration: the server derives all three
        from the categories.
      required: [subject_person_id, categories, purpose, case_reference]
      properties:
        subject_person_id:
          $ref: '#/components/schemas/Uuid'
        categories:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/BreakGlassCategory'
        purpose:
          $ref: '#/components/schemas/BreakGlassPurpose'
        case_reference:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{2,63}$'
    BreakGlassDecision:
      type: object
      additionalProperties: false
      required: [decision, reason_code]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reason_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{2,63}$'
    BreakGlassExercise:
      type: object
      additionalProperties: false
      required: [category, resource_type]
      properties:
        category:
          $ref: '#/components/schemas/BreakGlassCategory'
        resource_type:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
        resource_id:
          type: [string, 'null']
          format: uuid
    BreakGlassExerciseOutcome:
      type: object
      additionalProperties: false
      description: >-
        Every attempt is recorded before this answers, so `break_glass_event_id`
        is the evidence of this exact attempt. No outcome carries content in this
        version.
      required: [outcome, reason_code, break_glass_event_id, occurred_at]
      properties:
        outcome:
          type: string
          enum: [denied, content_unavailable]
        reason_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
        break_glass_event_id:
          $ref: '#/components/schemas/Uuid'
        occurred_at:
          type: string
          format: date-time
        category:
          $ref: '#/components/schemas/BreakGlassCategory'
    SupportOperationSourceKind:
      type: string
      enum: [notification, command]
    SupportOperationState:
      type: string
      description: >-
        `pending` is a notification not sent yet and `retrying` one that already
        failed, kept apart so a healthy queue does not read as a pile of
        failures. `stalled` is a command still processing long after it started.
      enum:
        - pending
        - retrying
        - delivered
        - dead_lettered
        - processing
        - stalled
        - succeeded
        - rejected_final
    SupportOperation:
      type: object
      additionalProperties: false
      description: >-
        Identifiers, states, timestamps, error codes and retries. No payload, no
        stored response, no principal fingerprint and no request hash: this read
        exists to diagnose without opening anyone's data.
