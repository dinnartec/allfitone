      description: >-
        The counterpart of the `PUT`, answering the same projection so the editor reads what it writes. Nothing else returns which routine version each day trains: the published read names the day and not the routine behind it, so a programme could be created and never reopened. A programme with no draft is one taken from Allfit rather than written here \u2014 forking copies the versions and never the draft \u2014 and answers 404, which is also what a programme belonging to somebody else answers.
      security:
        - bearerAuth: []
