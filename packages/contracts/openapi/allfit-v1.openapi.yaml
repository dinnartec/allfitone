          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
    delete:
      tags: [Space Identity]
      operationId: signOutOfSpace
      x-allfit-operation: OP-IDN-048
