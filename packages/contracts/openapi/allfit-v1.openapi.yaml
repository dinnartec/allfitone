      description: >-
        HU-SP-011. The only onboarding answer that is **not** a profile claim: weight
        and height are a time series, and criterion 2 asks for exactly that — "they
        stay as my first progress record".


        **One measurement per call.** `OP-IDN-006` fixes the record's id as the
        device's `Command-Id`, so weight and height are two commands with two keys.
