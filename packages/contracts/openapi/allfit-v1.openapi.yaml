      operationId: declareSpaceBiologicalSex
      x-allfit-operation: OP-IDN-045
      x-allfit-cache: no-store
      summary: Declare the account holder's biological sex
      description: >-
        HU-SP-096. Written straight onto `identity.people`, not into the profile
        claims catalogue. That catalogue exists for data that changes and that
        several sources observe, each with its own provenance and validity window;
        biological sex is a single stable fact with one possible source, so all of
        that machinery would sit unused.


        Declining is an answer, and the client does not call this operation for
        it: it simply moves on. The absence of a value is what records the refusal,
        because a sentinel such as `unknown` would force every later reader to tell
        "declined" apart from "never asked", and nothing needs that distinction.


        A second declaration with a different value **corrects** it. A person may go
        back and change what they answered, and declining after having declared
        clears the value. What does not move is the mark on the attempt: the question
        was answered either way, and that is what stops the flow asking again.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OnboardingAttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
