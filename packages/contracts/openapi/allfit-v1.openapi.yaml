openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Allfit V1 vertical slice API
  version: 1.0.0
  description: >-
    Canonical contract for the first implementable vertical slice shared by
    Allfit Studio and Allfit Space. Every operation maps to exactly one OP-* entry.
    Stable product endpoints outside this file remain non-implementable until
    added through the contract-first gate. Operational and provisional routes
    are not client contracts and must be declared in the auditable exclusion list.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
tags:
  - name: Platform Telemetry
    description: Public, non-identifying client telemetry gates for each product surface.
  - name: Studio Identity
    description: Hosted authentication and opaque browser sessions for Allfit Studio.
  - name: Backoffice Identity
    description: Password and TOTP authentication with application-owned AAL2 sessions.
  - name: Backoffice Catalogue
    description: Global catalogue curation performed by Allfit staff.
  - name: Global Catalogue
    description: Global published catalogue shared by every surface.
  - name: Backoffice Platform Access
    description: Base role and temporary platform duty administration for Allfit staff.
  - name: Backoffice Break Glass
    description: >-
      The exceptional path: a narrow, approved, time-boxed window over one
      person's data, where every attempt leaves evidence that person can see.
  - name: Backoffice Privacy
    description: >-
      Published permission definitions: what each permission a person grants
      actually covers, version by version.
  - name: Backoffice Verification
    description: >-
      Verifying professional credentials against their official registry or issuer,
      under a platform duty of its own.
  - name: Backoffice Organizations
    description: >-
      The organization directory Allfit's team uses to reach a gym, and later its
      lifecycle. Organizations only: nothing here searches or returns a person.
  - name: Backoffice Support
    description: >-
      The minimised operational projection Allfit staff read to resolve a case.
      It carries identifiers, states, timestamps and counters, and never a name,
      a full contact or the identity provider's subject.
  - name: Studio Organizations
    description: Studio entry context, organization creation and membership resolution.
  - name: Studio Catalog
    description: Governed professional catalogues available to active Studio people.
  - name: Space Identity
    description: >-
      Headless account creation and authentication for Allfit Space. The app owns
      its screens and never calls the identity provider: it posts credentials
      here and the API makes the provider call with the server API key.
  - name: Studio Planning
    description: Planning commands and queries performed from Allfit Studio.
  - name: Space Agenda
    description: Personal agenda queries exposed to Allfit Space.
  - name: Space Execution
    description: Workout execution commands performed from Allfit Space.
  - name: Studio Execution
    description: Authorized workout execution queries exposed to Allfit Studio.
  - name: Space Privacy
    description: Consent and privacy commands controlled by the person.
  - name: Space Nutrition
    description: Personal nutrition capture and goal operations.
  - name: Studio Nutrition
    description: Authorized professional nutrition operations.
x-allfit-contract-gate:
  source: V1_OPERATIONS_MATRIX.md
  rule: >-
    Every implemented route must either have an OpenAPI operation with
    x-allfit-operation or appear in exclusions. Exclusions are not stable client
    contracts and must correspond to an implemented route.
  exclusions:
    - method: GET
      path: /health
      classification: operational
      owner: platform
      lifecycle: permanent
      reason: Liveness belongs to deployment operations, not the product API.
    - method: POST
      path: /webhooks/workos
      classification: operational
      owner: identity
      lifecycle: permanent
      reason: Signed provider delivery shared by every application; it is not a client API.
x-allfit-error-catalog:
  - code: registration-incomplete
    status: 403
    description: The authenticated account has not completed domain registration.
  - code: account-closed
    status: 403
    description: The person linked to the authenticated account is closed.
  - code: rate-limited
    status: 429
    description: A closed invitation abuse-prevention limit rejected the attempt.
x-allfit-media-url-policy:
  space_owner:
    delivery: signed_storage_url
    scheme: HTTPS
    ttl_seconds: 300
    allowed_method: GET
    cache_control: private, no-store
    query_is_opaque: true
    logging: Never log or persist the query string.
  studio_professional:
    delivery: authenticated_api_proxy
    allowed_method: GET
    cache_control: private, no-store
    authorization_rechecked_per_request: true
    redirect_to_storage: false
    failure_without_effective_access: 404

paths:
  /backoffice/v1/telemetry-config:
    get:
      tags: [Platform Telemetry]
      operationId: getBackofficeTelemetryConfig
      x-allfit-operation: OP-SYS-011
      x-allfit-cache: public-300
      summary: Read the public Backoffice telemetry gate
      security: []
      responses:
        '200':
          description: Current Backoffice client telemetry gate and notice version
          headers:
            Cache-Control:
              schema:
                type: string
                const: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryClientConfig'

  /backoffice/v1/auth/password:
    post:
      tags: [Backoffice Identity]
      operationId: startBackofficePasswordAuthentication
      x-allfit-operation: OP-IDN-032
      x-allfit-cache: no-store
      summary: Validate Backoffice password credentials and start a TOTP attempt
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackofficePasswordRequest'
      responses:
        '200':
          description: TOTP challenge or first-factor enrollment is ready
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeAuthenticationAttempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /backoffice/v1/auth/attempt:
    get:
      tags: [Backoffice Identity]
      operationId: getBackofficeAuthenticationAttempt
      x-allfit-operation: OP-IDN-033
      x-allfit-cache: no-store
      summary: Recover the non-terminal TOTP attempt from its HttpOnly cookie
      security:
        - backofficeAttemptAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Current challenge or enrollment presentation
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeAuthenticationAttempt'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /backoffice/v1/auth/totp/verification:
    post:
      tags: [Backoffice Identity]
      operationId: verifyBackofficeTotp
      x-allfit-operation: OP-IDN-034
      x-allfit-cache: no-store
      summary: Verify TOTP and atomically materialize an AAL2 Backoffice session
      security:
        - backofficeAttemptAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '204':
          description: AAL2 session created and temporary attempt cookie removed
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /backoffice/v1/session:
    get:
      tags: [Backoffice Identity]
      operationId: getBackofficeSession
      x-allfit-operation: OP-IDN-035
      x-allfit-cache: no-store
      summary: Revalidate and return the minimal AAL2 Backoffice session
      security:
        - backofficeCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Active AAL2 Backoffice session
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /backoffice/v1/auth/logout:
    post:
      tags: [Backoffice Identity]
      operationId: logoutBackofficeSession
      x-allfit-operation: OP-IDN-036
      x-allfit-cache: no-store
      summary: Revoke the local session and its WorkOS sid without hosted logout
      security:
        - backofficeCookieAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  enum: [manual, inactivity, recovery]
                  default: manual
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  enum: [manual, inactivity, recovery]
                  default: manual
      responses:
        '204':
          description: Session is absent or revoked and the cookie is cleared
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '403':
          $ref: '#/components/responses/Forbidden'

  /backoffice/v1/auth/password-resets:
    post:
      tags: [Backoffice Identity]
      operationId: requestBackofficePasswordReset
      x-allfit-operation: OP-IDN-037
      x-allfit-cache: no-store
      summary: Ask WorkOS to send its uniform hosted password-recovery email
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
      responses:
        '202':
          description: Uniform response regardless of account existence or provider outcome
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /backoffice/v1/platform/role-assignments:
    get:
      tags: [Backoffice Platform Access]
      operationId: listBackofficePlatformRoles
      x-allfit-operation: OP-SUP-008
      x-allfit-cache: no-store
      summary: List who holds the Backoffice base role today and who held it before
      description: >-
        The internal Allfit catalogue. It is read-only evidence of who can reach the
        data and is never an authorization cache: every operation resolves its own
        duty in its own transaction.
      security:
        - backofficeCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Assignments ordered by effective state first, then by most recent grant
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformRoleAssignmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
    post:
      tags: [Backoffice Platform Access]
      operationId: grantBackofficePlatformRole
      x-allfit-operation: OP-SUP-007
      x-allfit-cache: no-store
      summary: Grant the Backoffice base role to another active person
      description: >-
        The base role only allows signing in. It grants no operation and implies no
        duty. Self-assignment is rejected by the database, not by this handler.
      security:
        - backofficeCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformRoleGrant'
      responses:
        '201':
          description: Base role granted, or the converged assignment for a repeated command
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformRoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /backoffice/v1/platform/role-assignments/{assignmentId}/revocation:
    post:
      tags: [Backoffice Platform Access]
      operationId: revokeBackofficePlatformRole
      x-allfit-operation: OP-SUP-007
      x-allfit-cache: no-store
      summary: Withdraw the Backoffice base role from another person
      description: >-
        Withdrawing the role revokes that person's Backoffice sessions and closes every
        effective duty without deleting history. The last active administrator cannot
        be withdrawn.
      security:
        - backofficeCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PlatformAssignmentId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Base role withdrawn, or the already withdrawn assignment
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformRoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /backoffice/v1/platform/duty-assignments:
    get:
      tags: [Backoffice Platform Access]
      operationId: listBackofficePlatformDuties
      x-allfit-operation: OP-SUP-011
      x-allfit-cache: no-store
      summary: List platform duties with their window, AAL, grantor and last recertification
      description: >-
        Shows effective, scheduled, suspended, expired and revoked assignments. A
        window that has elapsed reads as expired whether or not a job has moved the
        row, because validity is evaluated against the clock.
      security:
        - backofficeCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/PlatformPersonFilter'
        - $ref: '#/components/parameters/PlatformDutyFilter'
        - $ref: '#/components/parameters/PlatformDutyStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Assignments ordered by effective state first, then by newest window
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDutyAssignmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
    post:
      tags: [Backoffice Platform Access]
      operationId: grantBackofficePlatformDuty
      x-allfit-operation: OP-SUP-010
      x-allfit-cache: no-store
      summary: Grant a closed-catalogue platform duty for at most ninety days
      description: >-
        The actor mode is derived from the duty code and never accepted from the
        client. The target must already hold an active base role.
      security:
        - backofficeCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformDutyGrant'
      responses:
        '201':
          description: Duty granted, or the converged assignment for a repeated command
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDutyAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /backoffice/v1/platform/duty-assignments/{assignmentId}/suspension:
    post:
      tags: [Backoffice Platform Access]
      operationId: suspendBackofficePlatformDuty
      x-allfit-operation: OP-SUP-010
      x-allfit-cache: no-store
      summary: Suspend an effective platform duty
      description: >-
        Suspension cuts the duty's operations from the next transaction onwards. The
        assignment row stays, so the history remains readable.
      security:
        - backofficeCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PlatformAssignmentId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Duty suspended, or the already suspended assignment
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDutyAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /backoffice/v1/platform/duty-assignments/{assignmentId}/revocation:
    post:
      tags: [Backoffice Platform Access]
      operationId: revokeBackofficePlatformDuty
      x-allfit-operation: OP-SUP-010
      x-allfit-cache: no-store
      summary: Revoke a platform duty permanently
      description: >-
        Revocation is terminal for that assignment and cuts its operations from the
        next transaction onwards. History is never rewritten.
      security:
        - backofficeCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PlatformAssignmentId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Duty revoked, or the already revoked assignment
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDutyAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
  /backoffice/v1/result-contracts:
    post:
      tags: [Backoffice Catalogue]
      operationId: publishResultContract
      x-allfit-operation: OP-CAT-006
      x-allfit-cache: no-store
      summary: Publish the validation rules an activity must satisfy to count as complete
      description: >-
        A published version is immutable: correcting one publishes the next, and a
        newer version never reinterprets a session already recorded, because each
        execution freezes the contract and version it was validated against. The
        server assigns the version number. Publishing is refused unless the request
        carries at least one fixture the contract accepts and one it rejects.
      security:
        - backofficeCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultContractPublication'
      responses:
        '201':
          description: Contract published with its fixtures and its activity binding
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultContract'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /backoffice/v1/result-contracts/{contractId}/deprecation:
    post:
      tags: [Backoffice Catalogue]
      operationId: deprecateResultContract
      x-allfit-operation: OP-CAT-006
      x-allfit-cache: no-store
      summary: Stop new executions from freezing a published contract
      description: >-
        Deprecating closes the contract's activity bindings so nothing new can be
        validated against it. It does not invalidate the executions that already
        froze it, and it never deletes a version.
      security:
        - backofficeCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ResultContractId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Deprecated contract, or the already deprecated one
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultContract'
        '400':
