    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    UuidV4:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    UuidV7:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    IanaTimeZone:
      type: string
      minLength: 3
      maxLength: 100
      anyOf:
        - const: UTC
        - pattern: '^[A-Za-z_]+(?:/[A-Za-z0-9_+\-]+)+$'
    CompletenessLevel:
      type: string
      enum: [partial, summary, detailed, sensor_enriched]
    PublicationStatus:
      type: string
      enum: [draft, published, deprecated, archived]
    ExecutionStatus:
      type: string
      enum: [in_progress, paused, completed, abandoned]
    ScopeCode:
      type: string
      enum:
        [relationship_training, prior_training_history, body_progress, health_context,
         nutrition_intake, nutrition_guidance, nutrition_media]
    AccessLevel:
      type: string
      enum: [read, contribute]

    SessionTemplateCreate:
      type: object
      additionalProperties: false
      required: [discipline_code, title]
      properties:
        discipline_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
        title:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '.*\S.*'

    SpaceProgramCoverChoice:
      type: object
      additionalProperties: false
      required: [cover]
      properties:
        cover:
          oneOf:
            - $ref: '#/components/schemas/RoutineCover'
            - type: 'null'
          description: Null takes the cover off, and its routines go back to their names.
    SpaceProgramCover:
      type: object
      additionalProperties: false
      required: [program_id, cover]
      properties:
        program_id:
          $ref: '#/components/schemas/UuidV7'
        cover:
          oneOf:
            - $ref: '#/components/schemas/RoutineCover'
            - type: 'null'
    RoutineCover:
      oneOf:
        - $ref: '#/components/schemas/RoutineCoverMuscles'
        - $ref: '#/components/schemas/RoutineCoverIcon'
        - $ref: '#/components/schemas/RoutineCoverPhoto'
      discriminator:
        propertyName: kind
        mapping:
          muscles: '#/components/schemas/RoutineCoverMuscles'
          icon: '#/components/schemas/RoutineCoverIcon'
          photo: '#/components/schemas/RoutineCoverPhoto'
      description: >-
        How a programme's routines show themselves. One variant per kind, so a muscle
        cover cannot also carry an icon. The database refuses that too; refusing it in
        the contract means it cannot be expressed.

        **It is declared on the programme and read on the routine.** A routine that no
        programme holds has none, and is recognised by its name, the way it always was.
    RoutineCoverMuscles:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [muscles]
      description: >-
        Drawn from the exercises the routine already has, so it stores nothing else.
        Copying the muscles here would be a second truth that ages the moment somebody
        edits the routine.
    RoutineCoverIcon:
      type: object
      additionalProperties: false
      required: [kind, icon]
      properties:
        kind:
          type: string
          enum: [icon]
        icon:
          type: string
          enum:
            [strength, run, cycling, interval, cardio, burn, power, challenge, mountain,
             time, mobility, swim, arms, weights, technique, endurance, pace, energy,
             focus, recovery, morning, evening, night, cold, outdoor, route, pool, team,
             record, favourite, light, countdown]
          description: >-
            What the routine is about, not what it is done with. Closed, and appended to
            rather than reordered: an identifier is never reused, so a routine saved with
            one keeps drawing the same thing. Which order the grid uses is the app's.
      description: >-
        A choice nothing else can reconstruct, so it is stored. The vocabulary lives in
        the database rather than in the catalogue: nobody searches or filters by it, they
        declare it.
    RoutineCoverPhoto:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [photo]
      description: >-
        A photograph, and the routine does not say which: the second revision of
        `ADR-031` retired the personal upload, so this asks for one of the catalogue's
        covers and the dominant region of the muscles the routine works decides it. It
        carries nothing for the same reason the muscle cover carries nothing — the
        answer is already in the exercises, and copying it here would be a second truth.

        Where to fetch it is `cover_url`, composed by the server. The key never leaves
        the database.
    SessionTemplateDraftContent:
      type: object
      additionalProperties: false
      required: [title, activity_type_id, steps]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '.*\S.*'
        activity_type_id:
          type: [string, 'null']
          format: uuid
          description: Null is allowed only while the draft is incomplete.
        steps:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PlannedStepContent'

    PlannedStepContent:
      type: object
      additionalProperties: false
      required: [position, target]
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 200
        movement_id:
          type: [string, 'null']
          format: uuid
        activity_type_id:
          type: [string, 'null']
          format: uuid
          description: Optional per-step override for hybrid templates.
        notes:
          type: [string, 'null']
          maxLength: 2000
        superset_group:
          type: [integer, 'null']
          minimum: 1
          maximum: 200
          description: >-
            Steps sharing a group are performed back to back. Only neighbouring steps may share one, and `IX-46` refuses a group whose positions are not consecutive: a chain that skips an exercise describes an order nobody can execute. The rest of a chain is the one on its last step, because the rest happens when the chain ends.
        target:
          oneOf:
            - $ref: '#/components/schemas/StrengthTarget'
            - $ref: '#/components/schemas/EnduranceTarget'
            - $ref: '#/components/schemas/IntervalTarget'
            - $ref: '#/components/schemas/MobilityTarget'

    PlannedSetContent:
      type: object
      additionalProperties: false
      required: [set_order, kind]
      properties:
        set_order:
          type: integer
          minimum: 1
          maximum: 200
        kind:
          type: string
          enum: [normal, warmup, to_failure, drop]
        target_reps:
          type: [integer, 'null']
          minimum: 1
          maximum: 2147483647
        target_load_value:
          type: [number, 'null']
          minimum: 0
        target_load_unit_code:
          type: [string, 'null']
        target_rpe:
          type: [number, 'null']
          minimum: 0
          maximum: 10
      dependentSchemas:
        kind:
          if:
            properties:
              kind:
                const: to_failure
            required: [kind]
          then:
            properties:
              target_reps:
                type: 'null'
      description: >-
        One set of a strength step. A set to failure declares no reps, because the count is whatever comes out: "until you cannot" and "until eight" are different instructions, so the contract refuses the contradiction rather than leaving it to a screen.

    StrengthTarget:
      type: object
      additionalProperties: false
      required: [family]
      description: >-
        A strength target declares its sets one by one, or the aggregate an older draft carries — `planning.session_content_errors` refuses one with neither. That rule is not written here as `anyOf` on purpose: the generator turns such a union into `unknown`, which would cost every consumer its type to restate a constraint the database enforces anyway, and two guards that can disagree are worse than one.
      properties:
        family:
          type: string
          const: strength
        sets:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/PlannedSetContent'
          description: >-
            Every set, one by one. This is the truth of a strength prescription since `ADR-030`; `target_sets` and `target_reps` are the summary computed from it at publication, kept so that today's session, the week and the whole execution side keep reading what they always read. A draft written by the current editor carries `sets`; an older one carries only the aggregate, and publication synthesises the rows from it.
        target_sets:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Derived from `sets` at publication. `IX-47` stops any runtime role authoring it.
        target_reps:
          type: [integer, 'null']
          minimum: 1
          maximum: 2147483647
          description: Derived, and present only when every set agrees.
        target_load_value:
          type: [number, 'null']
          minimum: 0
        target_load_unit_code:
          type: [string, 'null']
        target_rpe:
          type: [number, 'null']
          minimum: 0
          maximum: 10
        target_rest_seconds:
          type: [integer, 'null']
          minimum: 0
          maximum: 3600
          description: >-
            Prescription, not measurement: the rest the step asks for between sets. Nullable because a step may say nothing about it, and a zero would mean "no rest", which is a different instruction from "nobody said".

    EnduranceTarget:
      type: object
      additionalProperties: false
      required: [family]
      allOf:
        - anyOf:
            - required: [target_distance_value, target_distance_unit_code]
              properties:
                target_distance_value:
                  type: number
                  exclusiveMinimum: 0
                target_distance_unit_code:
                  type: string
            - required: [target_duration_seconds]
              properties:
                target_duration_seconds:
                  type: number
                  exclusiveMinimum: 0
      properties:
        family:
          type: string
          const: endurance
        target_distance_value:
          type: [number, 'null']
          exclusiveMinimum: 0
        target_distance_unit_code:
          type: [string, 'null']
        target_duration_seconds:
          type: [number, 'null']
          exclusiveMinimum: 0
        target_pace_seconds_per_unit:
          type: [number, 'null']
          exclusiveMinimum: 0
        target_pace_unit_code:
          type: [string, 'null']

    IntervalTarget:
      type: object
      additionalProperties: false
      required: [family, rounds, work_duration_seconds]
      properties:
        family:
          type: string
          const: interval
        rounds:
          type: integer
          minimum: 1
          maximum: 2147483647
        work_duration_seconds:
          type: number
          exclusiveMinimum: 0
        rest_duration_seconds:
          type: [number, 'null']
          minimum: 0
        target_rpe:
          type: [number, 'null']
          minimum: 0
          maximum: 10

    MobilityTarget:
      type: object
      additionalProperties: false
      required: [family, sequence_position, side]
      allOf:
        - anyOf:
            - required: [hold_duration_seconds]
              properties:
                hold_duration_seconds:
                  type: number
                  exclusiveMinimum: 0
            - required: [target_repetitions]
