          maxLength: 160
    FitnessDataAccessPolicy:
      type: string
      description: >-
        A role never grants fitness data by itself. Coach still requires an active
        relationship, assignment, compatible grant, membership, role, and credentials.
      enum: [not_granted_by_role, requires_relationship_assignment_and_grant]
    OrganizationRole:
      type: object
      additionalProperties: false
