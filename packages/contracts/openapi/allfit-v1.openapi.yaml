      x-allfit-cache: no-store
      summary: Read the access log as an independent auditor
      description: >-
        Who from the team looked at whose data, and when. It carries the record
        of the access and never what was read.

        Separation of duties is **per case, not global**: an access that belongs
        to a break-glass window this auditor requested or approved is absent, and
        every other window stays auditable. `withheld_from_you` counts what was
