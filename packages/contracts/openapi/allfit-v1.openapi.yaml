        needs to make sense of it: what the person declared in the onboarding, and
        whether they already have a program.


        **Everything global, in one answer.** The catalogue is twenty-four programs
        and it is not paginated: the whole point of the screen is to pick a frequency
        for a goal, and a cursor over that would mean the app could not tell whether
        the five-day option exists without asking again.


        **Days per week and duration are derived, never stored.** They are facts
        about how a version is composed, and a stored copy would be a second truth
        about the number this screen is chosen on. A version that has no end date has
        no duration to derive: it returns a null `weeks`, because its composition
        repeats rather than running out.


