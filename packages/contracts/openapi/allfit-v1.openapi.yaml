  /space/v1/profile/claims:
    post:
      tags: [Space Identity]
      operationId: declareSpaceProfileClaim
      x-allfit-operation: OP-IDN-004
      x-allfit-cache: no-store
      summary: Declare an attribute of the account holder's fitness profile
      description: >-
        HU-SP-010 and the experience level of HU-SP-012 criterion 2, with the
        remaining attributes of HU-SP-013 and HU-SP-021 joining as their screens get
        built. The body is a discriminated union on `attribute_code`. The
        route is not under the onboarding attempt on purpose: a profile claim
        outlives the attempt, and the person edits it from their profile long
        after onboarding closed.


        Declaring the same attribute again **corrects** it. Nothing is edited: the
        previous claim is sealed with its end of validity and the new one records
        who superseded it, so what someone signed up with stays readable forever.
        That is also why the claim carries the device's `Command-Id` as its own
        identity — the primary key itself refuses a second claim from the same
        command.


        `improve_performance` exists in the attribute catalogue but is **not
        offered in the initial V1 launch**, so it is absent from the enum here and
        the operation refuses it. Keeping the value in the catalogue is what lets
        it arrive later without a migration.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceProfileClaimDeclaration'
      responses:
        '200':
          description: The claim as recorded
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceProfileClaim'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /space/v1/profile/focus-areas:
    post:
      tags: [Space Identity]
      operationId: declareSpaceFocusAreas
      x-allfit-operation: OP-IDN-046
      x-allfit-cache: no-store
      summary: Declare which body zones the account holder wants emphasised
      description: >-
        HU-SP-097. Separate from `OP-IDN-004` because the emphasis is the first
        profile attribute that holds **several values at once**, and that operation
        cannot write it: it seals the live claim of the same attribute before
        inserting, so three zones would leave one.


        The body carries the **whole set**, not one member. Declaring seals the
        zones that left, inserts the ones that arrived, and leaves the ones that
        stayed untouched — a zone still chosen keeps the moment it was first
        chosen. A withdrawn zone is closed rather than deleted, and carries no
        superseding claim, because nothing replaced it.


        `whole_body` is a member of the catalogue rather than an empty set: it is
        how someone says "no emphasis, let my goal decide". It is exclusive with
        every zone, and the empty array is refused — otherwise "I did not answer"
        and "I want no emphasis" would be the same request.


        Unlike `OP-IDN-004`, the `Command-Id` is not the identity of a stored row,
        because one command writes several. Idempotency rests on the durable
        receipt, and a replay answers the set in force.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceFocusAreasDeclaration'
      responses:
