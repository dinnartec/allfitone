        versions:
          type: array
          items:
            $ref: '#/components/schemas/ProgramVersion'

    ProgramPage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Program'
        page:
          $ref: '#/components/schemas/Page'

    ProgramVersion:
      type: object
      additionalProperties: false
      required:
        [
          id,
          program_id,
          version_number,
          status,
          title,
          sessions,
          published_at,
          session_count,
          deprecated_template_version_ids,
        ]
      example:
        id: 018f6f8d-2b00-7a00-8000-000000000201
        program_id: 018f6f8d-2b00-7a00-8000-000000000200
        version_number: 1
        status: published
        title: Bloque de fuerza
        sessions:
          - position: 1
            week: 1
            day: 1
            template_version_id: 018f6f8d-2b00-7a00-8000-000000000101
        published_at: '2026-07-27T09:12:00-05:00'
        session_count: 1
        deprecated_template_version_ids: []
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        program_id:
          $ref: '#/components/schemas/Uuid'
        version_number:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [published, deprecated]
        title:
          type: string
        notes:
          type: [string, 'null']
          maxLength: 2000
        sessions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProgramVersionSessionCreate'
        published_at:
          type: string
          format: date-time
        session_count:
          type: integer
          minimum: 1
        deprecated_template_version_ids:
