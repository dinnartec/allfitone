          $ref: '#/components/schemas/PlatformDutyCode'
        valid_from:
          type: string
          format: date-time
          description: Defaults to the command instant. A future value schedules the duty.
        valid_to:
          type: string
          format: date-time
          description: At most ninety days after valid_from; the database enforces the bound.
        reason_code:
          $ref: '#/components/schemas/PlatformAccessReasonCode'
    PlatformDutyAssignment:
      type: object
      additionalProperties: false
      required:
        - id
        - person_id
        - duty_code
        - actor_mode
        - status
        - valid_from
        - valid_to
        - required_aal
        - granted_by_person_id
        - recertified_by_person_id
        - recertified_at
        - suspended_by_person_id
        - suspended_at
        - revoked_by_person_id
        - revoked_at
        - reason_code
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        person_id:
          $ref: '#/components/schemas/Uuid'
        duty_code:
          $ref: '#/components/schemas/PlatformDutyCode'
        actor_mode:
          $ref: '#/components/schemas/PlatformActorMode'
        status:
          type: string
          enum: [scheduled, active, suspended, expired, revoked]
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        required_aal:
          type: integer
          const: 2
        granted_by_person_id:
          $ref: '#/components/schemas/Uuid'
        recertified_by_person_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        recertified_at:
          type: [string, 'null']
          format: date-time
        suspended_by_person_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        suspended_at:
          type: [string, 'null']
          format: date-time
        revoked_by_person_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        revoked_at:
          type: [string, 'null']
          format: date-time
        reason_code:
          $ref: '#/components/schemas/PlatformAccessReasonCode'
    BackofficePasswordRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
    BackofficeAuthenticationAttempt:
      type: object
      additionalProperties: false
      required: [next, expires_at]
      properties:
        next:
          type: string
          enum: [totp-challenge, totp-enrollment]
        expires_at:
          type: string
          format: date-time
        enrollment:
          type: object
          additionalProperties: false
          required: [qr_code, manual_key]
          properties:
            qr_code:
              type: string
              minLength: 1
              writeOnly: true
            manual_key:
              type: string
              minLength: 1
              writeOnly: true
      description: Enrollment secrets are present only for a first-factor attempt.
    BackofficeSession:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - assurance_level
        - authentication_method
        - operator
        - analytics
        - assurance_verified_at
        - inactivity_expires_at
        - absolute_expires_at
      properties:
        authenticated:
          type: boolean
          const: true
        assurance_level:
          type: integer
          const: 2
        authentication_method:
          type: string
          const: password_totp
        operator:
          type: object
          additionalProperties: false
          required: [given_name, family_name]
          properties:
            given_name:
              type: string
              minLength: 1
              maxLength: 100
            family_name:
              type: string
              minLength: 1
              maxLength: 100
        analytics:
          $ref: '#/components/schemas/AnalyticsIdentity'
        assurance_verified_at:
          type: string
          format: date-time
        inactivity_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
    SpaceRegistrationCreate:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: >-
            Becomes both the sign-in email and, once a person exists, the contact
            email. They are the same datum by DT-016 and never diverge.
        password:
          type: string
          minLength: 8
          maxLength: 256
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,256}$'
          description: >-
            At least eight characters, with a lowercase letter, an uppercase
            letter and a digit.
    SpaceRegistrationAccepted:
      type: object
      additionalProperties: false
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: When the verification code stops being accepted.
    SpaceRegistrationVerify:
      type: object
      additionalProperties: false
      required: [email, password, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The address the code was sent to.
        password:
          type: string
          minLength: 8
          maxLength: 256
          description: >-
            The same password used to register. Composition is not re-checked:
            the credential already exists, and rejecting it here would lock out
            an account created under an earlier policy.
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The six-digit code sent to the address.
    SpaceSessionTokens:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresIn, analytics]
      properties:
        accessToken:
          type: string
          description: >-
            Bearer token for /space/v1. Carries `sub` and `sid`; any other claim
            it may contain is ignored by the API, because authorization is
            resolved in PostgreSQL.
        refreshToken:
          type: string
          description: Rotates on use — the previous value stops working.
        expiresIn:
          type: integer
          minimum: 1
          description: Seconds until the access token expires.
        analytics:
          $ref: '#/components/schemas/AnalyticsIdentity'
    SpaceSignInCreate:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The address the account was created with.
        password:
          type: string
          minLength: 8
          maxLength: 256
          description: >-
            Composition is not re-checked here. The credential already exists,
            and rejecting it would lock out an account created under an earlier
            policy.
    SpacePasswordResetCreate:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: >-
            Shape only. Whether it has an account is precisely what the response
            must not reveal.
    SpaceSessionRefreshCreate:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 4096
    SpaceSessionRefreshed:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          description: Rotates on use — the previous value stops working.
        expiresIn:
          type: integer
          minimum: 1
      description: >-
        Carries no analytics identity, unlike a fresh sign-in, and carries no
        contact either: the verified address is server-only and never travels in
        a token response. The onboarding shows it from what the app stored when
        the person signed in, and reads everything else back from the attempt.
    StudioRegistrationStatus:
      type: string
      enum: [complete, registration_incomplete]
    StudioSession:
      type: object
      additionalProperties: false
      required: [authenticated, registration_status, identity, analytics]
      properties:
        authenticated:
          type: boolean
          const: true
        registration_status:
          $ref: '#/components/schemas/StudioRegistrationStatus'
        identity:
          $ref: '#/components/schemas/StudioAccountIdentity'
        analytics:
          $ref: '#/components/schemas/AnalyticsIdentity'
    StudioEntryContext:
      type: object
      additionalProperties: false
      required: [authenticated, registration_status, identity, memberships, analytics]
      properties:
        authenticated:
          type: boolean
          const: true
        registration_status:
          type: string
          enum: [complete, incomplete]
        identity:
          type: object
          additionalProperties: false
          required: [name, email]
          properties:
            name:
              type: [string, 'null']
              minLength: 1
              maxLength: 201
            email:
              type: [string, 'null']
              format: email
        memberships:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/StudioMembership'
        analytics:
          $ref: '#/components/schemas/AnalyticsIdentity'
    AnalyticsIdentity:
      type: object
      additionalProperties: false
      required: [distinct_id]
      properties:
        distinct_id:
          type: [string, 'null']
          pattern: '^a[1-9][0-9]*_[A-Za-z0-9_-]{43}$'
          description: >-
            Versioned HMAC pseudonym used only after local analytics consent.
            It is never accepted as authentication or domain identity.
    TelemetryClientConfig:
      type: object
      additionalProperties: false
      required: [enabled, notice_version]
      properties:
        enabled:
          type: boolean
        notice_version:
          type: string
          const: analytics-v1
    StudioAccountIdentity:
      type: object
      additionalProperties: false
      required: [given_name, family_name]
      properties:
        given_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
        family_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
    StudioOnboardingStatus:
      type: string
      enum: [open, activated, ineligible, expired]
    StudioOnboardingAttemptStart:
      type: object
      additionalProperties: false
      properties:
        invitation_token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Optional team-invitation token associated by hash only.
    StudioEligibilityStatus:
      type: string
      enum: [pending, pass, fail]
    StudioOnboardingAttempt:
      type: object
      additionalProperties: false
      required:
        [id, status, eligibility_status, expires_at, terms_version, privacy_notice_version]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        status:
          $ref: '#/components/schemas/StudioOnboardingStatus'
        eligibility_status:
          $ref: '#/components/schemas/StudioEligibilityStatus'
        expires_at:
          type: string
          format: date-time
        terms_version:
          type: string
          const: platform_terms_v1
        privacy_notice_version:
          type: string
          const: privacy_notice_v1
    SpaceOnboardingAttempt:
      type: object
      additionalProperties: false
      required: [id, status, eligibility_status, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        status:
          $ref: '#/components/schemas/StudioOnboardingStatus'
        eligibility_status:
          $ref: '#/components/schemas/StudioEligibilityStatus'
        expires_at:
          type: string
          format: date-time
      description: >-
        The same attempt Studio reads, without the legal versions. Space asks for
        those acceptances on a later screen and there are no consultable texts to
        name yet, so quoting a version here would assert something the product
        cannot honour.
    AdultEligibilityEvidenceCreate:
      type: object
      additionalProperties: false
      required: [declared_adult]
      properties:
        declared_adult:
          type: boolean
    SpacePendingFitnessIdCreate:
      type: object
      additionalProperties: false
      required: [given_name, family_name, username]
      properties:
        given_name:
          type: string
          minLength: 1
          maxLength: 120
        family_name:
          type: string
          minLength: 1
          maxLength: 120
        username:
          $ref: '#/components/schemas/Username'
      description: >-
        The email is absent on purpose. It is the credential's address, it
        already travels with the session, and changing it is another operation
        with its own verification.
    Username:
      type: string
      minLength: 3
      maxLength: 30
      pattern: '^[a-z][a-z0-9_]{2,29}$'
      description: >-
        Lowercase, starts with a letter, then letters, digits or underscore.
        Stored lowercased, and compared case-insensitively, so two handles that
        differ only in case are the same handle.
    SpacePendingFitnessId:
      type: object
      additionalProperties: false
      required: [given_name, family_name, username]
      properties:
        given_name:
          type: string
        family_name:
          type: string
        username:
          $ref: '#/components/schemas/Username'
      description: >-
        The Fitness ID as it now exists on the person, pending activation. No
        person identifier travels here: the app never needs one, and the API
        resolves it from the token on every call.
    SpaceCurrentOnboardingAttempt:
      type: object
      additionalProperties: false
      required: [attempt, identity]
      properties:
        attempt:
          oneOf:
            - $ref: '#/components/schemas/SpaceOnboardingAttempt'
            - type: 'null'
          description: >-
            Null when the account has no open attempt, which is also what an
            already activated person sees.
        identity:
          oneOf:
            - $ref: '#/components/schemas/SpacePendingFitnessId'
            - type: 'null'
          description: >-
            Null until the Fitness ID exists. Non-null is how the app knows that
            step is behind it.
      description: >-
        Enough to resume the onboarding and nothing more. Absent answers are
        null rather than omitted, so the app never has to guess whether a step
        was skipped or the field simply did not travel.
