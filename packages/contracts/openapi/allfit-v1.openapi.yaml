        decided_at: '2026-07-28T18:00:00Z'
        active_goal_version_id: 0190f2d6-68d2-71cf-8247-527651199d86
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        goal_version_id:
          $ref: '#/components/schemas/Uuid'
        decision:
          type: string
          enum: [accepted, rejected]
        decided_at:
          type: string
          format: date-time
        active_goal_version_id:
          type: [string, 'null']
          format: uuid

    NutritionGoalAuthor:
      type: object
      additionalProperties: false
      required: [kind, person_id]
      example:
        kind: professional
        person_id: 018f6f8d-2b00-7a00-8000-000000000103
      properties:
        kind:
          type: string
          enum: [self, professional]
        person_id:
          $ref: '#/components/schemas/Uuid'

    NutritionGoalVersion:
      type: object
      propertyNames:
        enum:
          - id
          - version_number
          - origin
          - status
          - rationale
          - targets
          - author
          - created_at
          - origin_relationship_id
          - decision
          - applied_scope
      oneOf:
        - properties:
            origin:
              const: self
            author:
              properties:
                kind:
                  const: self
        - properties:
            origin:
              const: professional
            rationale:
              type: string
              minLength: 1
              maxLength: 2000
              pattern: '.*\S.*'
            author:
              properties:
                kind:
                  const: professional
      required:
        [id, version_number, origin, status, rationale, targets, author, created_at,
         origin_relationship_id, decision, applied_scope]
      example:
        id: 0190f2d6-68d2-71cf-8247-527651199d86
        version_number: 2
        origin: professional
        status: proposed
        rationale: Objetivo diario no clínico
        targets:
          - nutrient_code: protein
            mode: range
            minimum: 100
            maximum: 130
            exact: null
            unit: g
        author:
          kind: professional
          person_id: 018f6f8d-2b00-7a00-8000-000000000103
        created_at: '2026-07-28T17:30:00Z'
        origin_relationship_id: 0190f2d6-68d3-7bcc-a6dd-dc353ffbfaa4
        decision: null
        applied_scope: null
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        version_number:
          type: integer
          minimum: 1
        origin:
          type: string
          enum: [self, professional]
        status:
          $ref: '#/components/schemas/NutritionGoalStatus'
        rationale:
          type: [string, 'null']
          maxLength: 2000
        targets:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/NutritionGoalTarget'
        author:
          $ref: '#/components/schemas/NutritionGoalAuthor'
        created_at:
          type: string
          format: date-time
        origin_relationship_id:
          type: [string, 'null']
          format: uuid
        decision:
          oneOf:
            - $ref: '#/components/schemas/NutritionGoalDecision'
            - type: 'null'
        applied_scope:
          oneOf:
            - $ref: '#/components/schemas/AppliedScope'
            - type: 'null'

    NutritionGoals:
      type: object
      additionalProperties: false
      required: [active, proposals]
      properties:
        active:
          oneOf:
            - $ref: '#/components/schemas/NutritionGoalVersion'
            - type: 'null'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/NutritionGoalVersion'

    NutritionGoalVersionPage:
      type: object
      additionalProperties: false
      required: [data, page, frozen_at]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NutritionGoalVersion'
        page:
          $ref: '#/components/schemas/Page'
        frozen_at:
          type: [string, 'null']
          format: date-time

    SignedMediaUrl:
      type: object
      additionalProperties: false
      required: [url, expires_at, method]
      example:
        url: https://media.allfit.invalid/private/object?signature=opaque
        expires_at: '2026-07-27T09:17:00-05:00'
        method: GET
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
        expires_at:
          type: string
          format: date-time
          description: At most five minutes after issuance.
        method:
          type: string
          const: GET

    AuthenticatedMediaLink:
      type: object
      additionalProperties: false
      required: [href, method]
      example:
        href: /studio/v1/organizations/018f6f8d-2b00-7a00-8000-000000000101/clients/018f6f8d-2b00-7a00-8000-000000000102/nutrition/meals/0190f2d6-68d0-7b4a-8d7f-d152223eed28/photo
        method: GET
      properties:
        href:
          type: string
          format: uri-reference
          pattern: '^/studio/v1/organizations/[^/?#]+/clients/[^/?#]+/nutrition/meals/[^/?#]+/photo$'
          description: Authenticated API URL; the bearer token and live authorization are required on every GET.
        method:
          type: string
          const: GET

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2000
        instance:
          type: string
          format: uri-reference
        request_id:
          type: string
          minLength: 16
          maxLength: 64
        required_scope:
          oneOf:
            - $ref: '#/components/schemas/RequiredScope'
            - type: 'null'
        errors:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ValidationIssue'
        current_state:
          description: Current server draft returned only for stale-draft conflicts.
          oneOf:
            - $ref: '#/components/schemas/SessionTemplateDraft'
            - $ref: '#/components/schemas/ProgramDraft'
    RequiredScope:
      type: object
      additionalProperties: false
      required: [code, level]
      properties:
        code:
          $ref: '#/components/schemas/ScopeCode'
        level:
          $ref: '#/components/schemas/AccessLevel'
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [code, path, message]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{1,63}$'
        path:
          type: string
          maxLength: 500
        message:
          type: string
          maxLength: 500
