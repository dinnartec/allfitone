        specialty_codes:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]{1,63}$'
    ProfessionalCredentialWrite:
      type: object
      additionalProperties: false
      required: [credential_type_code, issuer, name]
      properties:
        credential_type_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
        issuer:
          type: string
          minLength: 1
          maxLength: 200
        name:
          type: string
          minLength: 1
          maxLength: 200
        identifier:
          type: [string, 'null']
          minLength: 1
          maxLength: 160
        issued_on:
          type: [string, 'null']
          format: date
        expires_on:
          type: [string, 'null']
          format: date
        verification_url:
          type: [string, 'null']
          format: uri
          pattern: '^https://'
          maxLength: 2048
    ProfessionalCredentialVerification:
      type: object
      additionalProperties: false
      required: [state, valid_from, valid_to, effective]
      properties:
        state:
          type: string
          enum: [unverified, verified, expired, rejected, unverifiable, revoked]
        valid_from:
          type: [string, 'null']
          format: date-time
        valid_to:
          type: [string, 'null']
          format: date-time
        effective:
          type: boolean
    ProfessionalCredential:
      type: object
      additionalProperties: false
      required:
        - id
        - credential_type_code
        - credential_type_name
        - issuer
        - name
        - identifier
        - issued_on
        - expires_on
        - verification_url
        - status
        - supersedes_credential_id
        - created_at
        - retired_at
        - verification
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        credential_type_code:
          type: string
        credential_type_name:
          type: string
        issuer:
          type: string
        name:
          type: string
        identifier:
          type: [string, 'null']
        issued_on:
          type: [string, 'null']
          format: date
        expires_on:
          type: [string, 'null']
          format: date
        verification_url:
          type: [string, 'null']
          format: uri
        status:
          type: string
          enum: [active, retired]
        supersedes_credential_id:
          oneOf:
            - $ref: '#/components/schemas/UuidV7'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        retired_at:
          type: [string, 'null']
          format: date-time
        verification:
          $ref: '#/components/schemas/ProfessionalCredentialVerification'
    ProfessionalProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - headline
        - bio
        - practice_started_year
        - experience_years
        - specialties
        - credentials
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UuidV7'
        headline:
          type: string
        bio:
          type: string
        practice_started_year:
          type: integer
          minimum: 1900
        experience_years:
          type: integer
          minimum: 0
        specialties:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/ProfessionalCatalogItem'
        credentials:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ProfessionalCredential'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StudioMe:
      type: object
      additionalProperties: false
      required: [profile, memberships]
      properties:
        profile:
          oneOf:
            - $ref: '#/components/schemas/ProfessionalProfile'
            - type: 'null'
        memberships:
          type: array
          description: Personal active memberships followed by terminated membership history.
          maxItems: 100
          items:
            $ref: '#/components/schemas/StudioMembership'
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    UuidV4:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    UuidV7:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    IanaTimeZone:
      type: string
      minLength: 3
      maxLength: 100
      anyOf:
        - const: UTC
        - pattern: '^[A-Za-z_]+(?:/[A-Za-z0-9_+\-]+)+$'
    CompletenessLevel:
      type: string
      enum: [partial, summary, detailed, sensor_enriched]
    PublicationStatus:
      type: string
      enum: [draft, published, deprecated, archived]
    ExecutionStatus:
      type: string
      enum: [in_progress, paused, completed, abandoned]
    ScopeCode:
      type: string
      enum:
        [relationship_training, prior_training_history, body_progress, health_context,
         nutrition_intake, nutrition_guidance, nutrition_media]
    AccessLevel:
      type: string
      enum: [read, contribute]

    SessionTemplateCreate:
      type: object
      additionalProperties: false
      required: [discipline_code, title]
      properties:
        discipline_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
        title:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '.*\S.*'

    SessionTemplateDraftContent:
      type: object
      additionalProperties: false
      required: [title, activity_type_id, steps]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '.*\S.*'
        activity_type_id:
          type: [string, 'null']
          format: uuid
          description: Null is allowed only while the draft is incomplete.
        steps:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PlannedStepContent'

    PlannedStepContent:
      type: object
      additionalProperties: false
      required: [position, target]
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 200
        movement_id:
          type: [string, 'null']
          format: uuid
        activity_type_id:
          type: [string, 'null']
          format: uuid
          description: Optional per-step override for hybrid templates.
        notes:
          type: [string, 'null']
          maxLength: 2000
        target:
          oneOf:
            - $ref: '#/components/schemas/StrengthTarget'
            - $ref: '#/components/schemas/EnduranceTarget'
            - $ref: '#/components/schemas/IntervalTarget'
            - $ref: '#/components/schemas/MobilityTarget'

    StrengthTarget:
      type: object
      additionalProperties: false
      required: [family, target_sets]
      properties:
        family:
          type: string
          const: strength
        target_sets:
          type: integer
          minimum: 1
          maximum: 2147483647
        target_reps:
          type: [integer, 'null']
          minimum: 1
          maximum: 2147483647
        target_load_value:
          type: [number, 'null']
          minimum: 0
        target_load_unit_code:
          type: [string, 'null']
        target_rpe:
          type: [number, 'null']
          minimum: 0
          maximum: 10

    EnduranceTarget:
      type: object
      additionalProperties: false
      required: [family]
      allOf:
        - anyOf:
            - required: [target_distance_value, target_distance_unit_code]
              properties:
                target_distance_value:
                  type: number
                  exclusiveMinimum: 0
                target_distance_unit_code:
                  type: string
            - required: [target_duration_seconds]
              properties:
                target_duration_seconds:
                  type: number
                  exclusiveMinimum: 0
      properties:
        family:
          type: string
          const: endurance
        target_distance_value:
          type: [number, 'null']
          exclusiveMinimum: 0
        target_distance_unit_code:
          type: [string, 'null']
        target_duration_seconds:
          type: [number, 'null']
          exclusiveMinimum: 0
        target_pace_seconds_per_unit:
          type: [number, 'null']
          exclusiveMinimum: 0
        target_pace_unit_code:
          type: [string, 'null']

    IntervalTarget:
      type: object
      additionalProperties: false
      required: [family, rounds, work_duration_seconds]
      properties:
        family:
          type: string
          const: interval
        rounds:
          type: integer
          minimum: 1
          maximum: 2147483647
        work_duration_seconds:
          type: number
          exclusiveMinimum: 0
        rest_duration_seconds:
          type: [number, 'null']
          minimum: 0
        target_rpe:
          type: [number, 'null']
          minimum: 0
          maximum: 10

    MobilityTarget:
      type: object
      additionalProperties: false
      required: [family, sequence_position, side]
      allOf:
        - anyOf:
            - required: [hold_duration_seconds]
              properties:
                hold_duration_seconds:
                  type: number
                  exclusiveMinimum: 0
            - required: [target_repetitions]
              properties:
                target_repetitions:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
      properties:
        family:
          type: string
          const: mobility
        sequence_position:
          type: integer
          minimum: 1
          maximum: 2147483647
        hold_duration_seconds:
          type: [number, 'null']
          exclusiveMinimum: 0
        target_repetitions:
          type: [integer, 'null']
          minimum: 1
          maximum: 2147483647
        side:
          type: string
          enum: [left, right, bilateral, not_applicable]

    SessionTemplateDraft:
      type: object
      additionalProperties: false
      required: [id, template_id, content_schema_version, content, etag, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        template_id:
          $ref: '#/components/schemas/Uuid'
        content_schema_version:
          type: integer
          const: 1
        content:
          $ref: '#/components/schemas/SessionTemplateDraftContent'
        derived_from_version_id:
          type: [string, 'null']
          format: uuid
        etag:
          type: string
          pattern: '^"sha256:[A-Za-z0-9_-]{43}"$'
        updated_at:
          type: string
          format: date-time

    SessionTemplateVersionSummary:
      type: object
      additionalProperties: false
      required: [id, template_id, version_number, status, published_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        template_id:
          $ref: '#/components/schemas/Uuid'
        version_number:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [published, deprecated]
        published_at:
          type: string
          format: date-time

    SessionTemplateVersion:
      type: object
      additionalProperties: false
      required:
        [id, template_id, version_number, discipline_code, activity_type_id, title, status,
         published_at, steps]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        template_id:
          $ref: '#/components/schemas/Uuid'
        version_number:
          type: integer
          minimum: 1
        discipline_code:
          type: string
        activity_type_id:
          $ref: '#/components/schemas/Uuid'
        derived_from_version_id:
          type: [string, 'null']
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [published, deprecated]
        published_at:
          type: string
          format: date-time
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PlannedStepContent'

    SessionTemplate:
      type: object
      additionalProperties: false
      required: [id, organization_id, discipline_code, status, author_person_id, draft, versions]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organization_id:
          $ref: '#/components/schemas/Uuid'
        discipline_code:
          type: string
        status:
          $ref: '#/components/schemas/PublicationStatus'
        author_person_id:
          $ref: '#/components/schemas/Uuid'
        draft:
          $ref: '#/components/schemas/SessionTemplateDraft'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SessionTemplateVersionSummary'

    SessionTemplatePage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionTemplate'
        page:
          $ref: '#/components/schemas/Page'

    ProgramCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '.*\S.*'

    ProgramVersionSessionCreate:
      type: object
      additionalProperties: false
      required: [position, week, day, template_version_id]
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 730
        week:
          type: integer
          minimum: 1
          maximum: 104
        day:
          type: integer
          minimum: 1
          maximum: 7
        template_version_id:
          $ref: '#/components/schemas/Uuid'

    ProgramDraftContent:
      type: object
      additionalProperties: false
      required: [title, sessions]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '.*\S.*'
        notes:
          type: [string, 'null']
          maxLength: 2000
        sessions:
          type: array
          maxItems: 730
          items:
            $ref: '#/components/schemas/ProgramVersionSessionCreate'

    ProgramDraft:
      type: object
      additionalProperties: false
      required: [id, program_id, content_schema_version, content, etag, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        program_id:
          $ref: '#/components/schemas/Uuid'
        content_schema_version:
          type: integer
          const: 1
        content:
          $ref: '#/components/schemas/ProgramDraftContent'
        etag:
          type: string
          pattern: '^"sha256:[A-Za-z0-9_-]{43}"$'
        updated_at:
          type: string
          format: date-time
        deprecated_template_version_ids:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'

    Program:
      type: object
      additionalProperties: false
      required: [id, organization_id, status, author_person_id, draft, versions]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        organization_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/PublicationStatus'
        author_person_id:
          $ref: '#/components/schemas/Uuid'
        draft:
