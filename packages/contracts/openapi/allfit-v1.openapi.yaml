      x-allfit-cache: no-store
      summary: Record the verification of one credential version
      description: >-
        `verified`, `rejected` or `unverifiable`, checked against the official
        registry or the issuer. There is no default result. The policy, the
        validity and the evidence fingerprint are derived by the server and cannot
        be proposed: the validity never exceeds twelve months, the source's own
        expiry or the credential's, and a source that reports the credential lapsed
        cannot produce `verified`.

        The response carries the outcome, never the registry reference or the
        fingerprint. Verifying one credential marks nothing else as verified.
      security:
        - backofficeCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommandId'
