        - source
        - reference_id
        - subject_kind
        - subject_id
        - label
        - state
        - occurred_at
        - attempt_count
        - last_error_code
        - resolved_at
      properties:
        source:
          $ref: '#/components/schemas/SupportOperationSourceKind'
        reference_id:
          $ref: '#/components/schemas/Uuid'
        subject_kind:
          type: [string, 'null']
          maxLength: 64
        subject_id:
          type: [string, 'null']
          format: uuid
        label:
          type: string
          maxLength: 120
        state:
          $ref: '#/components/schemas/SupportOperationState'
        occurred_at:
          type: string
          format: date-time
        attempt_count:
          type: integer
          minimum: 0
        last_error_code:
          type: [string, 'null']
          maxLength: 120
        resolved_at:
          type: [string, 'null']
          format: date-time
    SupportOperationPage:
      type: object
      additionalProperties: false
      required: [data, page]
