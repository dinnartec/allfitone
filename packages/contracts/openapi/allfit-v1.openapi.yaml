        remember to ask.

        Reading this reaches the holder's data, so each row is recorded against
        the holder before it is returned. `viewer_can_decide` is false when the
        caller is the holder or shares an active organization with them. It is a
        hint for the screen, never authority: the decision revalidates on its own.
