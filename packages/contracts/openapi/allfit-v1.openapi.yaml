components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: allfit_studio_session
      description: Opaque, host-only, HttpOnly Studio browser-session cookie.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: WorkOS AuthKit access token validated for the selected surface.

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PlannedSessionId:
      name: plannedSessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MealId:
      name: mealId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GoalVersionId:
      name: goalVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUIDv4 reused only for HTTP retries of this operation.
      schema:
        $ref: '#/components/schemas/UuidV4'
    CommandId:
      name: Command-Id
      in: header
      required: true
      description: UUIDv7 durable identity generated when the user intention is created.
      schema:
        $ref: '#/components/schemas/UuidV7'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag for the execution revision used as the command base.
      schema:
        type: string
        pattern: '^"execution:[0-9a-f-]{36}:r[0-9]+"$'
    NutritionMealIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag for the nutrition meal revision used as the command base.
      schema:
        type: string
        pattern: '^"nutrition-meal:[0-9a-f-]{36}:r[0-9]+"$'
    HistoricalAccessCase:
      name: X-Historical-Access-Case
      in: header
      required: false
      description: Opaque case UUID. When present the endpoint uses only the frozen guidance projection.
      schema:
        $ref: '#/components/schemas/Uuid'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 160
    FromDate:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      required: true
      description: Inclusive date; range from..to must not exceed 31 days.
      schema:
        type: string
        format: date
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 1024

  headers:
    NoStore:
      required: true
      schema:
        type: string
        const: no-store
    PrivateNoStore:
      required: true
      schema:
        type: string
        const: private, no-store
    PrivateRevalidate:
      required: true
      schema:
        type: string
        const: private, max-age=0, must-revalidate
    ETag:
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 160
    Location:
      required: true
      schema:
        type: string
        format: uri-reference
    IdempotentReplay:
      required: false
      description: Present and true only when the minimal outcome is replayed.
      schema:
        type: string
        const: 'true'
    RetryAfter:
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 30
    SetCookie:
      required: true
      description: Sets or clears an HttpOnly browser cookie; its value is always opaque.
      schema:
        type: string

  responses:
    BadRequest:
      description: Missing/invalid headers or malformed request
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/idempotency-key-required
            title: Idempotency-Key is required
            status: 400
            request_id: 01JEXAMPLE0000000000000000
    Unauthenticated:
      description: Missing, invalid or expired token
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/unauthenticated
            title: Authentication is required
            status: 401
            request_id: 01JEXAMPLE0000000000000000
    Forbidden:
      description: Authenticated actor cannot execute the operation
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/forbidden
            title: The actor cannot execute this operation
            status: 403
            request_id: 01JEXAMPLE0000000000000000
    AccountClosed:
      description: The person linked to the authenticated account is closed
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/account-closed
            title: The account is closed
            status: 403
            request_id: 01JEXAMPLE0000000000000000
    TooManyRequests:
      description: >-
        Rate limit exceeded. Mandatory on the authentication surface: without it a
        six-digit verification code is brute-forceable, and repeated registration
        attempts become a way to enumerate addresses by timing.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpstreamUnavailable:
      description: An authentication dependency is temporarily unavailable
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/upstream-unavailable
            title: Authentication is temporarily unavailable
            status: 503
            request_id: 01JEXAMPLE0000000000000000
    ScopeRequired:
      description: Required live grant is not effective
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/scope-required
            title: Required consent is not effective
            status: 403
            request_id: 01JEXAMPLE0000000000000000
            required_scope:
              code: relationship_training
              level: read
    NotFound:
      description: Resource absent or not visible to the actor
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/not-found
            title: Resource not found
            status: 404
            request_id: 01JEXAMPLE0000000000000000
    Conflict:
      description: Concurrent conflict or idempotency identity reuse
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/idempotency-in-progress
            title: The command is still in progress
            status: 409
            request_id: 01JEXAMPLE0000000000000000
    StaleDraft:
      description: If-Match refers to a stale execution revision
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/stale-draft
            title: The local draft is stale
            status: 409
            request_id: 01JEXAMPLE0000000000000000
    PreconditionRequired:
      description: If-Match is required
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/precondition-required
            title: If-Match is required
            status: 428
            request_id: 01JEXAMPLE0000000000000000
    ValidationFailed:
      description: Request violates its closed schema or business validation
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/validation-failed
            title: The request does not satisfy the contract
            status: 422
            request_id: 01JEXAMPLE0000000000000000
            errors:
              - code: required
                path: /started_at
                message: started_at is required.
    ContractValidationFailed:
      description: Execution results do not satisfy the frozen result contract
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/contract-validation-failed
            title: The execution does not satisfy its frozen result contract
            status: 422
            request_id: 01JEXAMPLE0000000000000000
            errors:
              - code: required
                path: /strength_sets/0/achieved_reps
                message: The detailed contract requires achieved repetitions.
    CommandEffectDisposed:
      description: The command already ran but its effect was disposed
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.allfit.invalid/command-effect-disposed
            title: The command effect was disposed
            status: 410
            request_id: 01JEXAMPLE0000000000000000

  schemas:
    SpaceRegistrationCreate:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: >-
            Becomes both the sign-in email and, once a person exists, the contact
            email. They are the same datum by DT-016 and never diverge.
        password:
          type: string
          minLength: 12
          maxLength: 256
          description: >-
            Minimum length is the only rule enforced here. Composition rules push
            people toward predictable substitutions; length and a breach check at
            the provider do more.
    SpaceRegistrationAccepted:
      type: object
      additionalProperties: false
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: When the verification code stops being accepted.
    SpaceRegistrationVerify:
      type: object
      additionalProperties: false
      required: [email, password, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The address the code was sent to.
        password:
          type: string
          minLength: 12
          maxLength: 256
          description: >-
            The same password used to register. The provider mints the pending
            verification token from a sign-in attempt, so it is required here and
            is not a second authentication factor.
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The six-digit code sent to the address.
    SpaceSessionTokens:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: >-
            Bearer token for /space/v1. Carries `sub` and `sid`; any other claim
            it may contain is ignored by the API, because authorization is
            resolved in PostgreSQL.
        refreshToken:
          type: string
          description: Rotates on use — the previous value stops working.
        expiresIn:
          type: integer
          minimum: 1
          description: Seconds until the access token expires.
    StudioRegistrationStatus:
      type: string
      enum: [complete, registration_incomplete]
    StudioSession:
      type: object
      additionalProperties: false
      required: [authenticated, registration_status]
      properties:
        authenticated:
          type: boolean
          const: true
        registration_status:
          $ref: '#/components/schemas/StudioRegistrationStatus'
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    UuidV4:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    UuidV7:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    IanaTimeZone:
      type: string
      minLength: 3
      maxLength: 100
      anyOf:
        - const: UTC
        - pattern: '^[A-Za-z_]+(?:/[A-Za-z0-9_+\-]+)+$'
    CompletenessLevel:
      type: string
      enum: [partial, summary, detailed, sensor_enriched]
    PublicationStatus:
      type: string
      enum: [draft, published, deprecated, archived]
    ExecutionStatus:
      type: string
      enum: [in_progress, paused, completed, abandoned]
    ScopeCode:
      type: string
      enum:
        [relationship_training, prior_training_history, body_progress, health_context,
         nutrition_intake, nutrition_guidance, nutrition_media]
    AccessLevel:
      type: string
      enum: [read, contribute]

    ProgramVersionCreate:
      type: object
      additionalProperties: false
      required: [sessions]
      example:
        notes: Bloque de fuerza de ocho semanas
        sessions:
          - position: 1
            week: 1
            day: 1
            session_template_version_id: 018f6f8d-2b00-7a00-8000-000000000101
            template_version_number: 1
          - position: 2
            week: 1
