      summary: Publish a version of my programme
      description: >-
        Its sessions point at the person\u2019s own routines. Publishing a new version does not change anybody who already took the programme: they keep the plan they took.


        **Publishing leaves the author following what they published, and only
        once.** If they already follow this programme, the agenda they are on moves
