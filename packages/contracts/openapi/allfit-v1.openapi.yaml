          uniqueItems: true
          description: >-
            Current roles for an active membership, or roles effective at termination
            for a terminated membership.
          items:
            $ref: '#/components/schemas/OrganizationRoleCode'
    OrganizationMembershipPage:
      type: object
      additionalProperties: false
      required: [data, page]
