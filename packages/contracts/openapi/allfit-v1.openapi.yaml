  /space/v1/onboarding-attempts/{attemptId}/fitness-id:
    post:
      tags: [Space Identity]
      operationId: createSpacePendingFitnessId
      x-allfit-operation: OP-IDN-043
      x-allfit-cache: no-store
      summary: Create the account holder's Fitness ID, pending activation
      description: >-
        HU-SP-098. The Fitness ID is created here, in `pending_activation`, as
        soon as the name is known — not at the end of the onboarding. That is what
        lets every answer given afterwards be written straight onto the person:
        profile claims require a `person_id`, so with the person created last
        there would be nowhere for them to go and every step would need a staging
        table and a second write path.


        Adult eligibility is still required first. Creating the row earlier does
        not move any control earlier.


        Called again by an account that already has one, it **corrects** the name,
        surname and handle on the same person rather than refusing. Adult eligibility
        is still required: a correction does not get to skip a control.


        There is deliberately no way to ask whether a username is free. A
        collision comes back as `409` from this command and nothing else: an
        availability query would reveal that somebody exists, which is the
        guarantee the whole registration flow is built on. What makes the
        collision itself tolerable is that a handle, unlike an email address, is
        not an identifier that exists outside the platform.


        The email is not accepted as input. It belongs to the credential, and
        changing it is `OP-IDN-021` with its own verification.
